<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TutorFlow — Календарь Репетитора</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const DAYS = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
    const HOURS = Array.from({ length: 15 }, (_, i) => `${String(i + 8).padStart(2, '0')}:00`);

    function App() {
      // Режимы: 'calendar' | 'slots_setup' | 'students'
      const [view, setView] = useState('calendar');
      const [weekOffset, setWeekOffset] = useState(0);

      // Данные в LocalStorage
      const [workingSlots, setWorkingSlots] = useState(() => {
        const saved = localStorage.getItem('tutor_slots');
        return saved ? JSON.parse(saved) : []; // [{ day: 0..6, time: "15:00" }]
      });

      const [students, setStudents] = useState(() => {
        const saved = localStorage.getItem('tutor_students');
        return saved ? JSON.parse(saved) : [
          { id: '1', name: 'Алексей', defaultRate: 50, balance: 50, note: '8 класс, подготовка' },
          { id: '2', name: 'Мария', defaultRate: 60, balance: 0, note: 'Геометрия' }
        ];
      });

      const [recurringLessons, setRecurringLessons] = useState(() => {
        const saved = localStorage.getItem('tutor_recurring');
        return saved ? JSON.parse(saved) : []; // [{ id, day, time, studentId, rate }]
      });

      const [lessonLogs, setLessonLogs] = useState(() => {
        const saved = localStorage.getItem('tutor_logs');
        return saved ? JSON.parse(saved) : {}; 
        // key: "weekOffset_day_time" -> { status: 'attended'|'missed'|'cancelled', paidStatus: 'paid'|'unpaid', note: '' }
      });

      const [modalSlot, setModalSlot] = useState(null); // открытое модальное окно урока

      // Синхронизация с localStorage
      useEffect(() => {
        localStorage.setItem('tutor_slots', JSON.stringify(workingSlots));
      }, [workingSlots]);

      useEffect(() => {
        localStorage.setItem('tutor_students', JSON.stringify(students));
      }, [students]);

      useEffect(() => {
        localStorage.setItem('tutor_recurring', JSON.stringify(recurringLessons));
      }, [recurringLessons]);

      useEffect(() => {
        localStorage.setItem('tutor_logs', JSON.stringify(lessonLogs));
      }, [lessonLogs]);

      // Включение / выключение рабочего слота
      const toggleWorkingSlot = (day, time) => {
        const exists = workingSlots.some(s => s.day === day && s.time === time);
        if (exists) {
          setWorkingSlots(workingSlots.filter(s => !(s.day === day && s.time === time)));
          setRecurringLessons(recurringLessons.filter(r => !(r.day === day && r.time === time)));
        } else {
          setWorkingSlots([...workingSlots, { day, time }]);
        }
      };

      // Добавление платежа ученику
      const handleAddPayment = (studentId, amount) => {
        const val = parseFloat(amount);
        if (isNaN(val) || val <= 0) return;
        setStudents(students.map(s => s.id === studentId ? { ...s, balance: s.balance + val } : s));
      };

      // Привязка ученика к повторяющемуся слоту
      const assignStudentToSlot = (day, time, studentId, customRate) => {
        const filtered = recurringLessons.filter(r => !(r.day === day && r.time === time));
        if (studentId) {
          const student = students.find(s => s.id === studentId);
          filtered.push({
            id: Date.now().toString(),
            day,
            time,
            studentId,
            rate: customRate || (student ? student.defaultRate : 50)
          });
        }
        setRecurringLessons(filtered);
        setModalSlot(null);
      };

      // Обновление лога конкретного урока на конкретной неделе
      const updateLessonStatus = (logKey, studentId, rate, newStatus, newPaidStatus) => {
        const currentLog = lessonLogs[logKey] || {};
        const oldPaid = currentLog.paidStatus || 'unpaid';
        
        let balanceDelta = 0;
        // Логика списания баланса при отметке оплачено
        if (oldPaid !== 'paid' && newPaidStatus === 'paid') {
          balanceDelta = -rate;
        } else if (oldPaid === 'paid' && newPaidStatus !== 'paid') {
          balanceDelta = rate;
        }

        if (balanceDelta !== 0) {
          setStudents(students.map(s => s.id === studentId ? { ...s, balance: s.balance + balanceDelta } : s));
        }

        setLessonLogs({
          ...lessonLogs,
          [logKey]: {
            ...currentLog,
            status: newStatus,
            paidStatus: newPaidStatus
          }
        });
      };

      // Экспорт данных в JSON
      const exportBackup = () => {
        const data = { workingSlots, students, recurringLessons, lessonLogs };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `tutor_backup_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
      };

      // Импорт данных
      const importBackup = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data.students) setStudents(data.students);
            if (data.workingSlots) setWorkingSlots(data.workingSlots);
            if (data.recurringLessons) setRecurringLessons(data.recurringLessons);
            if (data.lessonLogs) setLessonLogs(data.lessonLogs);
            alert('Данные успешно импортированы!');
          } catch (err) {
            alert('Ошибка чтения файла!');
          }
        };
        reader.readAsText(file);
      };

      // Статистика за выбранную неделю
      const weekStats = () => {
        let plannedCount = 0;
        let earned = 0;
        let unpaidCount = 0;

        recurringLessons.forEach(slot => {
          const key = `${weekOffset}_${slot.day}_${slot.time}`;
          const log = lessonLogs[key];
          const isAttended = log?.status === 'attended' || (!log?.status && true);
          const isPaid = log?.paidStatus === 'paid' || (students.find(s => s.id === slot.studentId)?.balance >= slot.rate);

          if (log?.status !== 'cancelled') {
            plannedCount++;
            if (isPaid) earned += slot.rate;
            else unpaidCount++;
          }
        });

        return { plannedCount, earned, unpaidCount };
      };

      const stats = weekStats();

      return (
        <div className="max-w-7xl mx-auto p-4 sm:p-6">
          {/* Верхняя панель */}
          <header className="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-6 border-b border-slate-200">
            <div>
              <h1 className="text-2xl font-bold text-slate-900 tracking-tight flex items-center gap-2">
                📅 TutorFlow <span className="text-xs bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full font-semibold">CRM Репетитора</span>
              </h1>
              <p className="text-sm text-slate-500 mt-0.5">Расписание, учет оплат и баланс занятий</p>
            </div>

            <div className="flex flex-wrap items-center gap-2">
              <button 
                onClick={() => setView('calendar')} 
                className={`px-3.5 py-1.5 rounded-lg text-sm font-medium transition ${view === 'calendar' ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white text-slate-700 hover:bg-slate-100 border border-slate-200'}`}
              >
                Расписание
              </button>
              <button 
                onClick={() => setView('slots_setup')} 
                className={`px-3.5 py-1.5 rounded-lg text-sm font-medium transition ${view === 'slots_setup' ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white text-slate-700 hover:bg-slate-100 border border-slate-200'}`}
              >
                ⚙️ Настройка слотов
              </button>
              <button 
                onClick={() => setView('students')} 
                className={`px-3.5 py-1.5 rounded-lg text-sm font-medium transition ${view === 'students' ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white text-slate-700 hover:bg-slate-100 border border-slate-200'}`}
              >
                👥 Ученики & Баланс
              </button>
              
              <div className="h-6 w-px bg-slate-200 mx-1"></div>
              
              <button onClick={exportBackup} title="Скачать бэкап" className="p-2 bg-white text-slate-600 hover:bg-slate-100 border border-slate-200 rounded-lg text-xs font-medium">
                💾 Бэкап
              </button>
              <label className="p-2 bg-white text-slate-600 hover:bg-slate-100 border border-slate-200 rounded-lg text-xs font-medium cursor-pointer" title="Загрузить бэкап">
                📂 Импорт
                <input type="file" accept=".json" onChange={importBackup} className="hidden" />
              </label>
            </div>
          </header>

          {/* Вид: Календарь */}
          {view === 'calendar' && (
            <div className="mt-6">
              {/* Недельная навигация и сводка */}
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6 bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <div className="flex items-center gap-2">
                  <button onClick={() => setWeekOffset(w => w - 1)} className="p-1.5 border border-slate-200 rounded-lg hover:bg-slate-100 font-bold">←</button>
                  <button onClick={() => setWeekOffset(0)} className="px-3 py-1 border border-slate-200 rounded-lg hover:bg-slate-100 text-xs font-medium">Текущая неделя</button>
                  <button onClick={() => setWeekOffset(w => w + 1)} className="p-1.5 border border-slate-200 rounded-lg hover:bg-slate-100 font-bold">→</button>
                  <span className="text-sm font-semibold text-slate-700 ml-2">
                    {weekOffset === 0 ? 'Текущая неделя' : weekOffset > 0 ? `Через +${weekOffset} нед.` : `${weekOffset} нед. назад`}
                  </span>
                </div>

                <div className="flex items-center gap-4 text-xs sm:text-sm">
                  <div className="bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-100">
                    <span className="text-slate-500">Занятий:</span> <strong className="text-slate-800">{stats.plannedCount}</strong>
                  </div>
                  <div className="bg-emerald-50 px-3 py-1.5 rounded-lg border border-emerald-100">
                    <span className="text-emerald-700">Оплачено/в балансе:</span> <strong className="text-emerald-800">{stats.earned} zł</strong>
                  </div>
                  <div className="bg-amber-50 px-3 py-1.5 rounded-lg border border-amber-100">
                    <span className="text-amber-700">Не оплачено:</span> <strong className="text-amber-800">{stats.unpaidCount}</strong>
                  </div>
                </div>
              </div>

              {/* Сетка календаря */}
              <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-x-auto custom-scrollbar">
                <div className="min-w-[850px]">
                  {/* Заголовки дней */}
                  <div className="grid grid-cols-8 border-b border-slate-200 bg-slate-50 text-center text-xs font-semibold text-slate-600">
                    <div className="p-3 border-r border-slate-200">Время</div>
                    {DAYS.map((d, i) => (
                      <div key={d} className="p-3 border-r border-slate-200 last:border-r-0">
                        {d}
                      </div>
                    ))}
                  </div>

                  {/* Временные ряды */}
                  {HOURS.map(time => (
                    <div key={time} className="grid grid-cols-8 border-b border-slate-100 min-h-[70px]">
                      <div className="p-2 text-xs font-medium text-slate-400 text-center border-r border-slate-200 bg-slate-50/50 flex items-center justify-center">
                        {time}
                      </div>

                      {DAYS.map((_, dayIdx) => {
                        const isWorking = workingSlots.some(s => s.day === dayIdx && s.time === time);
                        const recurring = recurringLessons.find(r => r.day === dayIdx && r.time === time);
                        const student = recurring ? students.find(s => s.id === recurring.studentId) : null;
                        
                        const logKey = `${weekOffset}_${dayIdx}_${time}`;
                        const log = lessonLogs[logKey];
                        
                        // Проверка статуса оплаты (с учетом аванса ученика)
                        const isAutoPaidByBalance = student && student.balance >= (recurring?.rate || 0);
                        const isPaid = log?.paidStatus === 'paid' || (log?.paidStatus === undefined && isAutoPaidByBalance);
                        const status = log?.status || 'scheduled';

                        return (
                          <div 
                            key={dayIdx} 
                            className={`p-1.5 border-r border-slate-100 last:border-r-0 relative transition ${!isWorking ? 'bg-slate-100/60' : 'hover:bg-indigo-50/30'}`}
                          >
                            {isWorking && !recurring && (
                              <button 
                                onClick={() => setModalSlot({ day: dayIdx, time, recurring: null })}
                                className="w-full h-full border border-dashed border-slate-300 hover:border-indigo-400 hover:bg-white rounded-lg flex items-center justify-center text-slate-400 hover:text-indigo-600 text-xs font-medium transition"
                              >
                                + Записать
                              </button>
                            )}

                            {isWorking && recurring && student && (
                              <div 
                                onClick={() => setModalSlot({ day: dayIdx, time, recurring, logKey, student, log })}
                                className={`h-full w-full p-2 rounded-lg cursor-pointer border flex flex-col justify-between transition shadow-sm ${
                                  status === 'cancelled' 
                                    ? 'bg-rose-50 border-rose-200 opacity-60 text-slate-500' 
                                    : status === 'attended' 
                                    ? 'bg-emerald-50/60 border-emerald-200' 
                                    : 'bg-white border-slate-200 hover:border-indigo-300'
                                }`}
                              >
                                <div>
                                  <div className="flex items-center justify-between gap-1">
                                    <span className="font-semibold text-xs text-slate-900 truncate">{student.name}</span>
                                    <span className={`text-[10px] px-1.5 py-0.5 rounded font-bold ${isPaid ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}`}>
                                      {isPaid ? 'Оплачено' : 'Долг'}
                                    </span>
                                  </div>
                                  <div className="text-[11px] text-slate-500 mt-0.5">{recurring.rate} zł</div>
                                </div>

                                <div className="flex items-center justify-between text-[10px] text-slate-400 pt-1 border-t border-slate-100">
                                  <span>
                                    {status === 'scheduled' && '⏳ Запланирован'}
                                    {status === 'attended' && '✅ Проведен'}
                                    {status === 'cancelled' && '❌ Отменен'}
                                  </span>
                                  {student.balance > 0 && (
                                    <span className="text-indigo-600 font-medium" title="Остаток на балансе">+{student.balance} zł</span>
                                  )}
                                </div>
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* Вид: Настройка рабочих слотов */}
          {view === 'slots_setup' && (
            <div className="mt-6 bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
              <div className="max-w-2xl mb-6">
                <h2 className="text-lg font-bold text-slate-900">1. Настройте свои рабочие часы</h2>
                <p className="text-sm text-slate-600 mt-1">
                  Нажимайте на ячейки, чтобы отметить время, когда вы готовы проводить занятия. Эти слоты станут активным каркасом вашего календаря на каждую неделю.
                </p>
              </div>

              <div className="grid grid-cols-8 border border-slate-200 rounded-lg overflow-hidden text-center text-xs">
                <div className="p-2.5 font-bold bg-slate-100 border-b border-r border-slate-200">Время</div>
                {DAYS.map(d => (
                  <div key={d} className="p-2.5 font-bold bg-slate-100 border-b border-r border-slate-200 last:border-r-0">{d}</div>
                ))}

                {HOURS.map(time => (
                  <React.Fragment key={time}>
                    <div className="p-2 border-b border-r border-slate-200 bg-slate-50 font-medium text-slate-500 flex items-center justify-center">
                      {time}
                    </div>
                    {DAYS.map((_, dayIdx) => {
                      const isActive = workingSlots.some(s => s.day === dayIdx && s.time === time);
                      return (
                        <button
                          key={dayIdx}
                          onClick={() => toggleWorkingSlot(dayIdx, time)}
                          className={`p-2 border-b border-r border-slate-200 last:border-r-0 text-xs font-semibold transition ${
                            isActive ? 'bg-indigo-600 text-white hover:bg-indigo-700' : 'bg-white hover:bg-slate-50 text-slate-300'
                          }`}
                        >
                          {isActive ? '✓ Работа' : '—'}
                        </button>
                      );
                    })}
                  </React.Fragment>
                ))}
              </div>
            </div>
          )}

          {/* Вид: Ученики & Баланс */}
          {view === 'students' && (
            <StudentsManager 
              students={students} 
              setStudents={setStudents} 
              onAddPayment={handleAddPayment} 
            />
          )}

          {/* Модальное окно управления уроком */}
          {modalSlot && (
            <LessonModal 
              slot={modalSlot} 
              onClose={() => setModalSlot(null)}
              students={students}
              onAssign={assignStudentToSlot}
              onUpdateStatus={updateLessonStatus}
              onAddPayment={handleAddPayment}
            />
          )}
        </div>
      );
    }

    // Компонент списка учеников
    function StudentsManager({ students, setStudents, onAddPayment }) {
      const [name, setName] = useState('');
      const [rate, setRate] = useState(50);
      const [note, setNote] = useState('');
      const [payInputs, setPayInputs] = useState({});

      const handleAddStudent = (e) => {
        e.preventDefault();
        if (!name.trim()) return;
        setStudents([...students, {
          id: Date.now().toString(),
          name: name.trim(),
          defaultRate: Number(rate) || 50,
          balance: 0,
          note: note.trim()
        }]);
        setName('');
        setNote('');
      };

      const handlePaymentSubmit = (id) => {
        const val = payInputs[id];
        if (val) {
          onAddPayment(id, val);
          setPayInputs({ ...payInputs, [id]: '' });
        }
      };

      return (
        <div className="mt-6 grid grid-cols-1 md:grid-cols-3 gap-6">
          {/* Форма добавления */}
          <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm h-fit">
            <h3 className="font-bold text-slate-900 mb-4">Добавить ученика</h3>
            <form onSubmit={handleAddStudent} className="space-y-3">
              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">Имя ученика</label>
                <input 
                  type="text" 
                  value={name} 
                  onChange={e => setName(e.target.value)} 
                  placeholder="Имя Фамилия"
                  className="w-full text-sm px-3 py-2 border border-slate-300 rounded-lg focus:outline-indigo-500"
                  required
                />
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">Стандартная ставка (zł / урок)</label>
                <input 
                  type="number" 
                  value={rate} 
                  onChange={e => setRate(e.target.value)} 
                  className="w-full text-sm px-3 py-2 border border-slate-300 rounded-lg focus:outline-indigo-500"
                  required
                />
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">Заметка / Класс</label>
                <input 
                  type="text" 
                  value={note} 
                  onChange={e => setNote(e.target.value)} 
                  placeholder="напр. 9 класс, ОГЭ / Математика"
                  className="w-full text-sm px-3 py-2 border border-slate-300 rounded-lg focus:outline-indigo-500"
                />
              </div>
              <button type="submit" className="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-semibold transition">
                + Сохранить ученика
              </button>
            </form>
          </div>

          {/* Список учеников */}
          <div className="md:col-span-2 space-y-3">
            <h3 className="font-bold text-slate-900 mb-2">Список учеников и лицевой счет ({students.length})</h3>
            {students.map(st => (
              <div key={st.id} className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div>
                  <div className="flex items-center gap-2">
                    <h4 className="font-bold text-slate-900">{st.name}</h4>
                    <span className="text-xs text-slate-500">({st.defaultRate} zł/урок)</span>
                  </div>
                  {st.note && <p className="text-xs text-slate-500 mt-0.5">{st.note}</p>}
                  <div className="mt-2 text-xs">
                    Баланс / Предоплата: <span className={`font-bold ${st.balance > 0 ? 'text-emerald-600 font-semibold' : st.balance < 0 ? 'text-rose-600' : 'text-slate-600'}`}>{st.balance} zł</span>
                    {st.balance >= st.defaultRate && (
                      <span className="ml-2 text-[11px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-medium">
                        Оплачено на {Math.floor(st.balance / st.defaultRate)} урок(а) вперед
                      </span>
                    )}
                  </div>
                </div>

                <div className="flex items-center gap-2">
                  <input 
                    type="number" 
                    placeholder="+ Внести zł" 
                    value={payInputs[st.id] || ''} 
                    onChange={e => setPayInputs({ ...payInputs, [st.id]: e.target.value })}
                    className="w-28 text-sm px-2.5 py-1.5 border border-slate-300 rounded-lg"
                  />
                  <button 
                    onClick={() => handlePaymentSubmit(st.id)}
                    className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-lg transition"
                  >
                    Пополнить
                  </button>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // Модальное окно занятия
    function LessonModal({ slot, onClose, students, onAssign, onUpdateStatus, onAddPayment }) {
      const [selectedStudentId, setSelectedStudentId] = useState(slot.recurring?.studentId || '');
      const [customRate, setCustomRate] = useState(slot.recurring?.rate || 50);
      const [paymentAddVal, setPaymentAddVal] = useState('');

      const student = slot.student;
      const isPaid = slot.log?.paidStatus === 'paid' || (student && student.balance >= (slot.recurring?.rate || 0));
      const currentStatus = slot.log?.status || 'scheduled';

      const handleAddDeposit = () => {
        if (!student || !paymentAddVal) return;
        onAddPayment(student.id, paymentAddVal);
        setPaymentAddVal('');
      };

      return (
        <div className="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
          <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-200">
            <div className="flex justify-between items-center pb-3 border-b border-slate-100">
              <h3 className="font-bold text-slate-900 text-base">
                {DAYS[slot.day]}, {slot.time}
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-lg">✕</button>
            </div>

            {/* Если слот еще не назначен на ученика */}
            {!slot.recurring ? (
              <div className="mt-4 space-y-4">
                <p className="text-xs text-slate-600">Назначить регулярного ученика на этот час:</p>
                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">Выберите ученика</label>
                  <select 
                    value={selectedStudentId} 
                    onChange={e => {
                      setSelectedStudentId(e.target.value);
                      const st = students.find(s => s.id === e.target.value);
                      if (st) setCustomRate(st.defaultRate);
                    }}
                    className="w-full text-sm px-3 py-2 border border-slate-300 rounded-lg"
                  >
                    <option value="">-- Выбрать --</option>
                    {students.map(s => <option key={s.id} value={s.id}>{s.name} ({s.defaultRate} zł)</option>)}
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">Стоимость занятия (zł)</label>
                  <input 
                    type="number" 
                    value={customRate} 
                    onChange={e => setCustomRate(e.target.value)} 
                    className="w-full text-sm px-3 py-2 border border-slate-300 rounded-lg"
                  />
                </div>

                <button 
                  onClick={() => onAssign(slot.day, slot.time, selectedStudentId, customRate)}
                  disabled={!selectedStudentId}
                  className="w-full py-2 bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 text-white rounded-lg text-sm font-semibold transition"
                >
                  Закрепить еженедельно
                </button>
              </div>
            ) : (
              /* Управление текущим уроком */
              <div className="mt-4 space-y-4">
                <div className="bg-slate-50 p-3 rounded-lg border border-slate-200 text-sm">
                  <div className="flex justify-between font-bold text-slate-900">
                    <span>{student?.name}</span>
                    <span>{slot.recurring.rate} zł</span>
                  </div>
                  <div className="text-xs text-slate-500 mt-1">
                    Баланс предоплаты: <strong className="text-indigo-600">{student?.balance || 0} zł</strong>
                  </div>
                </div>

                {/* Пополнение прямо в окне урока */}
                <div className="p-3 bg-emerald-50 border border-emerald-200 rounded-lg">
                  <label className="block text-[11px] font-bold text-emerald-800 mb-1">Внести оплату (например 100 zł за 2 урока):</label>
                  <div className="flex gap-2">
                    <input 
                      type="number" 
                      placeholder="Сумма zł" 
                      value={paymentAddVal} 
                      onChange={e => setPaymentAddVal(e.target.value)}
                      className="w-full text-xs px-2.5 py-1.5 border border-emerald-300 rounded bg-white"
                    />
                    <button 
                      onClick={handleAddDeposit}
                      className="px-3 py-1.5 bg-emerald-600 text-white text-xs font-bold rounded hover:bg-emerald-700"
                    >
                      Внести
                    </button>
                  </div>
                </div>

                {/* Статус посещения */}
                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">Статус проведения:</label>
                  <div className="grid grid-cols-3 gap-2">
                    <button 
                      onClick={() => onUpdateStatus(slot.logKey, student.id, slot.recurring.rate, 'attended', isPaid ? 'paid' : 'unpaid')}
                      className={`py-1.5 px-2 text-xs font-bold rounded-lg border transition ${currentStatus === 'attended' ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-white border-slate-200 hover:bg-slate-50'}`}
                    >
                      ✅ Был
                    </button>
                    <button 
                      onClick={() => onUpdateStatus(slot.logKey, student.id, slot.recurring.rate, 'scheduled', isPaid ? 'paid' : 'unpaid')}
                      className={`py-1.5 px-2 text-xs font-bold rounded-lg border transition ${currentStatus === 'scheduled' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white border-slate-200 hover:bg-slate-50'}`}
                    >
                      ⏳ Планируется
                    </button>
                    <button 
                      onClick={() => onUpdateStatus(slot.logKey, student.id, slot.recurring.rate, 'cancelled', 'unpaid')}
                      className={`py-1.5 px-2 text-xs font-bold rounded-lg border transition ${currentStatus === 'cancelled' ? 'bg-rose-600 text-white border-rose-600' : 'bg-white border-slate-200 hover:bg-slate-50'}`}
                    >
                      ❌ Отменен
                    </button>
                  </div>
                </div>

                {/* Открепить ученика */}
                <div className="pt-2 border-t border-slate-100 flex justify-between">
                  <button 
                    onClick={() => {
                      if (confirm('Освободить этот слот во все недели?')) {
                        onAssign(slot.day, slot.time, null);
                      }
                    }}
                    className="text-xs text-rose-600 hover:underline"
                  >
                    Освободить слот насовсем
                  </button>
                  <button onClick={onClose} className="px-4 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg">
                    Готово
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
