<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Календарь Репетитора (Облако Firebase)</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Вшитые ключи вашего проекта Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBsBQ9k2NT2QtMaiPgwxiXWs8emABm8GzA",
      authDomain: "tutor-calendar-b5653.firebaseapp.com",
      projectId: "tutor-calendar-b5653",
      storageBucket: "tutor-calendar-b5653.firebasestorage.app",
      messagingSenderId: "351202173543",
      appId: "1:351202173543:web:5a5561cebcdad3b4ed6ac2",
      measurementId: "G-76Y96NQ1J4"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();
    const docRef = db.collection('tutor_data').doc('main_schedule');

    const DAY_NAMES = ['Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота', 'Воскресенье'];
    const MONTH_NAMES = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];

    function getWeekDays(offset = 0) {
      const now = new Date();
      const dayOfWeek = now.getDay();
      const diffToMonday = (dayOfWeek === 0 ? -6 : 1) - dayOfWeek;
      
      const monday = new Date(now);
      monday.setDate(now.getDate() + diffToMonday + (offset * 7));
      monday.setHours(0, 0, 0, 0);

      const days = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        days.push(d);
      }
      return days;
    }

    function formatDateKey(date) {
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    }

    function App() {
      const [view, setView] = useState('calendar');
      const [weekOffset, setWeekOffset] = useState(0);
      const [syncStatus, setSyncStatus] = useState('Подключение к облаку...');

      const weekDays = useMemo(() => getWeekDays(weekOffset), [weekOffset]);

      const [workingSlots, setWorkingSlots] = useState([]);
      const [students, setStudents] = useState([]);
      const [recurringLessons, setRecurringLessons] = useState([]);
      const [lessonLogs, setLessonLogs] = useState({});

      const [modalSlot, setModalSlot] = useState(null);

      // Синхронизация с Firestore в реальном времени
      useEffect(() => {
        const unsubscribe = docRef.onSnapshot((doc) => {
          if (doc.exists) {
            const data = doc.data();
            setWorkingSlots(data.workingSlots || []);
            setStudents(data.students || []);
            setRecurringLessons(data.recurringLessons || []);
            setLessonLogs(data.lessonLogs || {});
            setSyncStatus('Облако подключено 🟢');
          } else {
            docRef.set({
              workingSlots: [],
              students: [],
              recurringLessons: [],
              lessonLogs: {}
            });
            setSyncStatus('Облако подключено 🟢');
          }
        }, (error) => {
          console.error("Ошибка Firebase:", error);
          setSyncStatus('Ошибка облака 🔴 (проверьте Test mode в базе)');
        });

        return () => unsubscribe();
      }, []);

      const saveToCloud = (updates) => {
        setSyncStatus('Сохранение... ⏳');
        docRef.set(updates, { merge: true })
          .then(() => setSyncStatus('Облако подключено 🟢'))
          .catch((err) => {
            console.error(err);
            setSyncStatus('Ошибка сохранения 🔴');
          });
      };

      const handleAddSlot = (day, startTime, duration) => {
        const newSlot = {
          id: Date.now().toString(),
          day: Number(day),
          startTime,
          duration: Number(duration) || 60
        };
        const updated = [...workingSlots, newSlot].sort((a, b) => a.startTime.localeCompare(b.startTime));
        setWorkingSlots(updated);
        saveToCloud({ workingSlots: updated });
      };

      const handleDeleteSlot = (slotId) => {
        const updatedSlots = workingSlots.filter(s => s.id !== slotId);
        const updatedRec = recurringLessons.filter(r => r.slotId !== slotId);
        setWorkingSlots(updatedSlots);
        setRecurringLessons(updatedRec);
        saveToCloud({ workingSlots: updatedSlots, recurringLessons: updatedRec });
      };

      const handleDeleteStudent = (studentId) => {
        if (!confirm('Удалить ученика? Занятия с ним будут очищены.')) return;
        const updatedStudents = students.filter(s => s.id !== studentId);
        const updatedRec = recurringLessons.filter(r => r.studentId !== studentId);
        setStudents(updatedStudents);
        setRecurringLessons(updatedRec);
        saveToCloud({ students: updatedStudents, recurringLessons: updatedRec });
      };

      const handleAddPayment = (studentId, amount) => {
        const val = parseFloat(amount);
        if (isNaN(val) || val <= 0) return;
        const updated = students.map(s => s.id === studentId ? { ...s, balance: s.balance + val } : s);
        setStudents(updated);
        saveToCloud({ students: updated });
      };

      const assignStudentToSlot = (slotId, studentId, customRate) => {
        const filtered = recurringLessons.filter(r => r.slotId !== slotId);
        if (studentId) {
          const student = students.find(s => s.id === studentId);
          filtered.push({
            slotId,
            studentId,
            rate: Number(customRate) || (student ? student.defaultRate : 50)
          });
        }
        setRecurringLessons(filtered);
        saveToCloud({ recurringLessons: filtered });
        setModalSlot(null);
      };

      const updateLessonStatus = (logKey, studentId, rate, newStatus, newPaidStatus) => {
        const currentLog = lessonLogs[logKey] || {};
        const oldPaid = currentLog.paidStatus || 'unpaid';
        
        let balanceDelta = 0;
        if (oldPaid !== 'paid' && newPaidStatus === 'paid') {
          balanceDelta = -rate;
        } else if (oldPaid === 'paid' && newPaidStatus !== 'paid') {
          balanceDelta = rate;
        }

        let updatedStudents = students;
        if (balanceDelta !== 0) {
          updatedStudents = students.map(s => s.id === studentId ? { ...s, balance: s.balance + balanceDelta } : s);
          setStudents(updatedStudents);
        }

        const updatedLogs = {
          ...lessonLogs,
          [logKey]: {
            ...currentLog,
            status: newStatus,
            paidStatus: newPaidStatus
          }
        };
        setLessonLogs(updatedLogs);
        saveToCloud({ students: updatedStudents, lessonLogs: updatedLogs });
      };

      const calculateEndTime = (startTime, duration) => {
        if (!startTime) return '';
        const [h, m] = startTime.split(':').map(Number);
        const totalMinutes = h * 60 + m + Number(duration);
        const endH = Math.floor(totalMinutes / 60) % 24;
        const endM = totalMinutes % 60;
        return `${String(endH).padStart(2, '0')}:${String(endM).padStart(2, '0')}`;
      };

      const weekStats = () => {
        let plannedCount = 0;
        let earned = 0;
        let unpaidCount = 0;

        weekDays.forEach((date, dayIdx) => {
          const dateStr = formatDateKey(date);
          const daySlots = workingSlots.filter(s => s.day === dayIdx);
          
          daySlots.forEach(slot => {
            const rel = recurringLessons.find(r => r.slotId === slot.id);
            if (!rel) return;

            const logKey = `${dateStr}_${slot.id}`;
            const log = lessonLogs[logKey];
            const student = students.find(s => s.id === rel.studentId);
            const isPaid = log?.paidStatus === 'paid' || (student && student.balance >= rel.rate);

            if (log?.status !== 'cancelled') {
              plannedCount++;
              if (isPaid) earned += rel.rate;
              else unpaidCount++;
            }
          });
        });

        return { plannedCount, earned, unpaidCount };
      };

      const stats = weekStats();
      const todayStr = formatDateKey(new Date());

      return (
        <div className="max-w-7xl mx-auto p-4 sm:p-6">
          <header className="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-6 border-b border-slate-200">
            <div>
              <div className="flex items-center gap-3">
                <h1 className="text-2xl font-bold text-slate-900 tracking-tight">📅 Календарь Репетитора</h1>
                <span className="text-[11px] font-semibold bg-slate-100 text-slate-700 px-2 py-0.5 rounded-full border border-slate-200">
                  {syncStatus}
                </span>
              </div>
              <p className="text-xs text-slate-500 mt-1">
                Сегодня: <strong className="text-slate-700">{new Date().toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</strong>
              </p>
            </div>

            <div className="flex flex-wrap items-center gap-2">
              <button 
                onClick={() => setView('calendar')} 
                className={`px-3.5 py-1.5 rounded-lg text-sm font-semibold transition ${view === 'calendar' ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white text-slate-700 hover:bg-slate-100 border border-slate-200'}`}
              >
                1. Расписание по дням
              </button>
              <button 
                onClick={() => setView('slots_setup')} 
                className={`px-3.5 py-1.5 rounded-lg text-sm font-semibold transition ${view === 'slots_setup' ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white text-slate-700 hover:bg-slate-100 border border-slate-200'}`}
              >
                ⚙️ 2. Часы работы ({workingSlots.length})
              </button>
              <button 
                onClick={() => setView('students')} 
                className={`px-3.5 py-1.5 rounded-lg text-sm font-semibold transition ${view === 'students' ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white text-slate-700 hover:bg-slate-100 border border-slate-200'}`}
              >
                👥 3. Ученики & Баланс ({students.length})
              </button>
            </div>
          </header>

          {/* ВИД: КАЛЕНДАРЬ */}
          {view === 'calendar' && (
            <div className="mt-6">
              {workingSlots.length === 0 ? (
                <div className="bg-amber-50 border border-amber-200 p-8 rounded-xl text-center">
                  <h3 className="font-bold text-amber-900 text-base mb-1">Вы пока не выставили часы работы</h3>
                  <p className="text-sm text-amber-700 mb-4">Укажите время, в которое вы готовы работать, и оно автоматически появится во всех неделях.</p>
                  <button onClick={() => setView('slots_setup')} className="px-4 py-2 bg-indigo-600 text-white font-semibold text-sm rounded-lg hover:bg-indigo-700">
                    Перейти к настройке часов →
                  </button>
                </div>
              ) : (
                <>
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6 bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                    <div className="flex items-center gap-2">
                      <button 
                        onClick={() => setWeekOffset(prev => prev - 1)} 
                        className="px-3 py-1.5 border border-slate-200 rounded-lg hover:bg-slate-100 font-semibold text-xs transition"
                      >
                        ← Пред. неделя
                      </button>
                      <button 
                        onClick={() => setWeekOffset(0)} 
                        className={`px-3 py-1.5 border rounded-lg text-xs font-bold transition ${weekOffset === 0 ? 'bg-indigo-50 border-indigo-200 text-indigo-700' : 'hover:bg-slate-100 border-slate-200'}`}
                      >
                        Текущая (Сегодня)
                      </button>
                      <button 
                        onClick={() => setWeekOffset(prev => prev + 1)} 
                        className="px-3 py-1.5 border border-slate-200 rounded-lg hover:bg-slate-100 font-semibold text-xs transition"
                      >
                        След. неделя →
                      </button>
                    </div>

                    <div className="text-sm font-bold text-slate-800 text-center">
                      {weekDays[0].getDate()} {MONTH_NAMES[weekDays[0].getMonth()]} — {weekDays[6].getDate()} {MONTH_NAMES[weekDays[6].getMonth()]} {weekDays[6].getFullYear()} г.
                    </div>

                    <div className="flex items-center justify-center gap-3 text-xs sm:text-sm">
                      <div className="bg-slate-50 px-3 py-1 rounded-lg border border-slate-100">
                        <span className="text-slate-500">Уроков:</span> <strong className="text-slate-800">{stats.plannedCount}</strong>
                      </div>
                      <div className="bg-emerald-50 px-3 py-1 rounded-lg border border-emerald-100">
                        <span className="text-emerald-700">Оплачено:</span> <strong className="text-emerald-800">{stats.earned} zł</strong>
                      </div>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-7 gap-3">
                    {weekDays.map((date, dayIdx) => {
                      const dateStr = formatDateKey(date);
                      const isToday = dateStr === todayStr;
                      const daySlots = workingSlots
                        .filter(s => s.day === dayIdx)
                        .sort((a, b) => a.startTime.localeCompare(b.startTime));

                      return (
                        <div 
                          key={dateStr} 
                          className={`p-3 rounded-xl border flex flex-col min-h-[400px] transition ${
                            isToday ? 'bg-indigo-50/50 border-indigo-300 ring-2 ring-indigo-200/50' : 'bg-slate-100/70 border-slate-200'
                          }`}
                        >
                          <div className="pb-2.5 mb-2 border-b border-slate-200 flex justify-between items-center">
                            <div>
                              <div className={`text-xs font-bold ${isToday ? 'text-indigo-700' : 'text-slate-800'}`}>
                                {DAY_NAMES[dayIdx]}
                              </div>
                              <div className="text-[11px] text-slate-500 font-medium">
                                {date.getDate()} {MONTH_NAMES[date.getMonth()]}
                              </div>
                            </div>
                            {isToday && (
                              <span className="text-[10px] bg-indigo-600 text-white font-bold px-1.5 py-0.5 rounded">
                                Сегодня
                              </span>
                            )}
                          </div>

                          {daySlots.length === 0 ? (
                            <div className="flex-1 flex items-center justify-center text-xs text-slate-400 italic">
                              Выходной
                            </div>
                          ) : (
                            <div className="space-y-2 flex-1">
                              {daySlots.map(slot => {
                                const recurring = recurringLessons.find(r => r.slotId === slot.id);
                                const student = recurring ? students.find(s => s.id === recurring.studentId) : null;
                                const logKey = `${dateStr}_${slot.id}`;
                                const log = lessonLogs[logKey];

                                const isAutoPaidByBalance = student && student.balance >= (recurring?.rate || 0);
                                const isPaid = log?.paidStatus === 'paid' || (log?.paidStatus === undefined && isAutoPaidByBalance);
                                const status = log?.status || 'scheduled';

                                return (
                                  <div key={slot.id} className="bg-white rounded-lg border border-slate-200 p-2.5 shadow-sm">
                                    <div className="flex items-center justify-between text-xs font-semibold text-slate-500 mb-1.5">
                                      <span>⏰ {slot.startTime} – {calculateEndTime(slot.startTime, slot.duration)}</span>
                                    </div>

                                    {!recurring ? (
                                      <button 
                                        onClick={() => setModalSlot({ slot, recurring: null, dateStr, dayIdx })}
                                        className="w-full py-2 border border-dashed border-slate-300 hover:border-indigo-400 hover:bg-indigo-50/30 rounded text-slate-400 hover:text-indigo-600 text-xs font-medium transition"
                                      >
                                        + Записать ученика
                                      </button>
                                    ) : (
                                      <div 
                                        onClick={() => setModalSlot({ slot, recurring, logKey, student, log, dateStr, dayIdx })}
                                        className={`p-2 rounded-lg cursor-pointer border transition ${
                                          status === 'cancelled' 
                                            ? 'bg-rose-50 border-rose-200 opacity-60 text-slate-500' 
                                            : status === 'attended' 
                                            ? 'bg-emerald-50/70 border-emerald-200' 
                                            : 'bg-indigo-50/40 border-indigo-100 hover:border-indigo-300'
                                        }`}
                                      >
                                        <div className="flex justify-between items-start gap-1">
                                          <span className="font-bold text-xs text-slate-900 truncate">{student?.name || 'Ученик удален'}</span>
                                          <span className={`text-[10px] px-1.5 py-0.5 rounded font-bold shrink-0 ${isPaid ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}`}>
                                            {isPaid ? 'Оплачено' : 'Долг'}
                                          </span>
                                        </div>

                                        <div className="text-[11px] text-slate-600 mt-1 flex justify-between items-center">
                                          <span>{recurring.rate} zł</span>
                                          {student?.balance > 0 && (
                                            <span className="text-[10px] text-emerald-700 font-semibold">Баланс: +{student.balance} zł</span>
                                          )}
                                        </div>

                                        <div className="text-[10px] text-slate-400 pt-1 mt-1 border-t border-slate-200/60 flex justify-between items-center">
                                          <span>
                                            {status === 'scheduled' && '⏳ Запланирован'}
                                            {status === 'attended' && '✅ Проведен'}
                                            {status === 'cancelled' && '❌ Отменен'}
                                          </span>
                                        </div>
                                      </div>
                                    )}
                                  </div>
                                );
                              })}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </>
              )}
            </div>
          )}

          {/* ВИД: НАСТРОЙКА ЧАСОВ */}
          {view === 'slots_setup' && (
            <SlotsManager 
              workingSlots={workingSlots} 
              onAddSlot={handleAddSlot} 
              onDeleteSlot={handleDeleteSlot}
              calculateEndTime={calculateEndTime}
              onGoToCalendar={() => setView('calendar')}
            />
          )}

          {/* ВИД: УЧЕНИКИ */}
          {view === 'students' && (
            <StudentsManager 
              students={students} 
              setStudents={(newStudents) => {
                setStudents(newStudents);
                saveToCloud({ students: newStudents });
              }} 
              onAddPayment={handleAddPayment} 
              onDeleteStudent={handleDeleteStudent}
            />
          )}

          {/* МОДАЛЬНОЕ ОКНО */}
          {modalSlot && (
            <LessonModal 
              data={modalSlot} 
              onClose={() => setModalSlot(null)}
              students={students}
              onAssign={assignStudentToSlot}
              onUpdateStatus={updateLessonStatus}
              onAddPayment={handleAddPayment}
              calculateEndTime={calculateEndTime}
              onOpenStudentsTab={() => { setModalSlot(null); setView('students'); }}
            />
          )}
        </div>
      );
    }

    function SlotsManager({ workingSlots, onAddSlot, onDeleteSlot, calculateEndTime, onGoToCalendar }) {
      const [day, setDay] = useState(0);
      const [startTime, setStartTime] = useState('14:30');
      const [duration, setDuration] = useState(60);

      const handleFormSubmit = (e) => {
        e.preventDefault();
        if (!startTime) return;
        onAddSlot(day, startTime, duration);
      };

      return (
        <div className="mt-6 grid grid-cols-1 md:grid-cols-3 gap-6">
          <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm h-fit">
            <h3 className="font-bold text-slate-900 text-base mb-1">Добавить рабочее время</h3>
            <p className="text-xs text-slate-500 mb-4">Любое время начала (например 14:30, 15:15).</p>
            
            <form onSubmit={handleFormSubmit} className="space-y-4">
              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">День недели</label>
                <select 
                  value={day} 
                  onChange={e => setDay(Number(e.target.value))}
                  className="w-full text-sm px-3 py-2 border border-slate-300 rounded-lg focus:outline-indigo-500 bg-white"
                >
                  {DAY_NAMES.map((d, idx) => <option key={d} value={idx}>{d}</option>)}
                </select>
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">Время начала</label>
                <input 
                  type="time" 
                  value={startTime} 
                  onChange={e => setStartTime(e.target.value)}
                  className="w-full text-sm px-3 py-2 border border-slate-300 rounded-lg focus:outline-indigo-500 bg-white"
                  required
                />
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">Длительность урока</label>
                <select 
                  value={duration} 
                  onChange={e => setDuration(Number(e.target.value))}
                  className="w-full text-sm px-3 py-2 border border-slate-300 rounded-lg focus:outline-indigo-500 bg-white"
                >
                  <option value={45}>45 минут</option>
                  <option value={60}>60 минут (1 час)</option>
                  <option value={90}>90 минут (1.5 часа)</option>
                  <option value={120}>120 минут (2 часа)</option>
                </select>
              </div>

              <button type="submit" className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-semibold transition shadow-sm">
                + Добавить в расписание
              </button>
            </form>
          </div>

          <div className="md:col-span-2 space-y-4">
            <div className="flex justify-between items-center">
              <h3 className="font-bold text-slate-900 text-base">Активные часы ({workingSlots.length})</h3>
              {workingSlots.length > 0 && (
                <button onClick={onGoToCalendar} className="text-xs bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg font-semibold transition">
                  Открыть календарь →
                </button>
              )}
            </div>

            {workingSlots.length === 0 ? (
              <div className="bg-white p-8 rounded-xl border border-dashed border-slate-300 text-center text-slate-400 text-sm">
                Вы пока не добавили ни одного рабочего часа.
              </div>
            ) : (
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                {DAY_NAMES.map((dName, dIdx) => {
                  const daySlots = workingSlots.filter(s => s.day === dIdx).sort((a,b) => a.startTime.localeCompare(b.startTime));
                  if (daySlots.length === 0) return null;

                  return (
                    <div key={dName} className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                      <h4 className="font-bold text-xs text-indigo-600 uppercase tracking-wider mb-2.5">{dName}</h4>
                      <div className="space-y-2">
                        {daySlots.map(s => (
                          <div key={s.id} className="flex justify-between items-center text-xs bg-slate-50 p-2.5 rounded-lg border border-slate-100">
                            <span className="font-semibold text-slate-700">
                              ⏰ {s.startTime} – {calculateEndTime(s.startTime, s.duration)} <span className="text-slate-400 font-normal">({s.duration}м)</span>
                            </span>
                            <button 
                              onClick={() => onDeleteSlot(s.id)}
                              className="text-rose-500 hover:text-rose-700 font-bold px-1.5 text-sm"
                              title="Удалить"
                            >
                              ✕
                            </button>
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      );
    }

    function StudentsManager({ students, setStudents, onAddPayment, onDeleteStudent }) {
      const [name, setName] = useState('');
      const [rate, setRate] = useState(50);
      const [note, setNote] = useState('');
      const [payInputs, setPayInputs] = useState({});

      const handleAddStudent = (e) => {
        e.preventDefault();
        if (!name.trim()) return;
        setStudents([...students, {
          id: Date.now().toString(),
          name: name.trim(),
          defaultRate: Number(rate) || 50,
          balance: 0,
          note: note.trim()
        }]);
        setName('');
        setNote('');
      };

      const handlePaymentSubmit = (id) => {
        const val = payInputs[id];
        if (val) {
          onAddPayment(id, val);
          setPayInputs({ ...payInputs, [id]: '' });
        }
      };

      return (
        <div className="mt-6 grid grid-cols-1 md:grid-cols-3 gap-6">
          <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm h-fit">
            <h3 className="font-bold text-slate-900 mb-3">Добавить ученика</h3>
            <form onSubmit={handleAddStudent} className="space-y-3">
              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">Имя и фамилия</label>
                <input 
                  type="text" 
                  value={name} 
                  onChange={e => setName(e.target.value)} 
                  placeholder="напр. Анна"
                  className="w-full text-sm px-3 py-2 border border-slate-300 rounded-lg focus:outline-indigo-500"
                  required
                />
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">Ставка за урок (zł)</label>
                <input 
                  type="number" 
                  value={rate} 
                  onChange={e => setRate(e.target.value)} 
                  className="w-full text-sm px-3 py-2 border border-slate-300 rounded-lg focus:outline-indigo-500"
                  required
                />
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">Заметка</label>
                <input 
                  type="text" 
                  value={note} 
                  onChange={e => setNote(e.target.value)} 
                  placeholder="напр. 8 класс / подготовка"
                  className="w-full text-sm px-3 py-2 border border-slate-300 rounded-lg focus:outline-indigo-500"
                />
              </div>
              <button type="submit" className="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-semibold transition">
                + Сохранить ученика
              </button>
            </form>
          </div>

          <div className="md:col-span-2 space-y-3">
            <h3 className="font-bold text-slate-900 mb-2">Все ученики ({students.length})</h3>
            {students.length === 0 ? (
              <div className="bg-white p-8 rounded-xl border border-dashed border-slate-300 text-center text-slate-400 text-sm">
                Список пуст. Добавьте учеников через форму.
              </div>
            ) : (
              students.map(st => (
                <div key={st.id} className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                  <div>
                    <div className="flex items-center gap-2">
                      <h4 className="font-bold text-slate-900">{st.name}</h4>
                      <span className="text-xs text-slate-500">({st.defaultRate} zł/урок)</span>
                    </div>
                    {st.note && <p className="text-xs text-slate-500 mt-0.5">{st.note}</p>}
                    <div className="mt-2 text-xs">
                      Баланс: <span className={`font-bold ${st.balance > 0 ? 'text-emerald-600 font-semibold' : st.balance < 0 ? 'text-rose-600' : 'text-slate-600'}`}>{st.balance} zł</span>
                      {st.balance >= st.defaultRate && (
                        <span className="ml-2 text-[11px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-medium">
                          Оплачено на {Math.floor(st.balance / st.defaultRate)} ур. вперед
                        </span>
                      )}
                    </div>
                  </div>

                  <div className="flex items-center gap-2">
                    <input 
                      type="number" 
                      placeholder="+ zł" 
                      value={payInputs[st.id] || ''} 
                      onChange={e => setPayInputs({ ...payInputs, [st.id]: e.target.value })}
                      className="w-24 text-sm px-2.5 py-1.5 border border-slate-300 rounded-lg"
                    />
                    <button 
                      onClick={() => handlePaymentSubmit(st.id)}
                      className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-lg transition"
                    >
                      Внести
                    </button>
                    <button 
                      onClick={() => onDeleteStudent(st.id)}
                      className="p-1.5 text-rose-500 hover:text-rose-700 font-bold ml-1 text-sm"
                      title="Удалить"
                    >
                      ✕
                    </button>
                  </div>
                </div>
              ))
            )}
          </div>
        </div>
      );
    }

    function LessonModal({ data, onClose, students, onAssign, onUpdateStatus, onAddPayment, calculateEndTime, onOpenStudentsTab }) {
      const { slot, recurring, logKey, student, log, dateStr, dayIdx } = data;
      const [selectedStudentId, setSelectedStudentId] = useState(recurring?.studentId || '');
      const [customRate, setCustomRate] = useState(recurring?.rate || 50);
      const [paymentAddVal, setPaymentAddVal] = useState('');

      const isPaid = log?.paidStatus === 'paid' || (student && student.balance >= (recurring?.rate || 0));
      const currentStatus = log?.status || 'scheduled';

      const handleAddDeposit = () => {
        if (!student || !paymentAddVal) return;
        onAddPayment(student.id, paymentAddVal);
        setPaymentAddVal('');
      };

      return (
        <div className="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
          <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-200">
            <div className="flex justify-between items-center pb-3 border-b border-slate-100">
              <div>
                <h3 className="font-bold text-slate-900 text-base">
                  {DAY_NAMES[dayIdx]}, {slot.startTime} – {calculateEndTime(slot.startTime, slot.duration)}
                </h3>
                <p className="text-xs text-slate-500">Дата урока: {dateStr}</p>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-lg font-bold">✕</button>
            </div>

            {!recurring ? (
              <div className="mt-4 space-y-4">
                {students.length === 0 ? (
                  <div className="text-center py-4">
                    <p className="text-xs text-slate-500 mb-3">Сначала создайте хотя бы одного ученика</p>
                    <button onClick={onOpenStudentsTab} className="px-3 py-1.5 bg-indigo-600 text-white rounded-lg text-xs font-semibold">
                      + Создать ученика
                    </button>
                  </div>
                ) : (
                  <>
                    <p className="text-xs text-slate-600">Закрепить регулярного ученика за этим слотом:</p>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Ученик</label>
                      <select 
                        value={selectedStudentId} 
                        onChange={e => {
                          setSelectedStudentId(e.target.value);
                          const st = students.find(s => s.id === e.target.value);
                          if (st) setCustomRate(st.defaultRate);
                        }}
                        className="w-full text-sm px-3 py-2 border border-slate-300 rounded-lg bg-white"
                      >
                        <option value="">-- Выбрать из списка --</option>
                        {students.map(s => <option key={s.id} value={s.id}>{s.name} ({s.defaultRate} zł)</option>)}
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Стоимость (zł)</label>
                      <input 
                        type="number" 
                        value={customRate} 
                        onChange={e => setCustomRate(e.target.value)} 
                        className="w-full text-sm px-3 py-2 border border-slate-300 rounded-lg"
                      />
                    </div>

                    <button 
                      onClick={() => onAssign(slot.id, selectedStudentId, customRate)}
                      disabled={!selectedStudentId}
                      className="w-full py-2 bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 text-white rounded-lg text-sm font-semibold transition"
                    >
                      Закрепить еженедельно
                    </button>
                  </>
                )}
              </div>
            ) : (
              <div className="mt-4 space-y-4">
                <div className="bg-slate-50 p-3 rounded-lg border border-slate-200 text-sm">
                  <div className="flex justify-between font-bold text-slate-900">
                    <span>{student?.name}</span>
                    <span>{recurring.rate} zł</span>
                  </div>
                  <div className="text-xs text-slate-500 mt-1">
                    Аванс ученика: <strong className="text-indigo-600">{student?.balance || 0} zł</strong>
                  </div>
                </div>

                <div className="p-3 bg-emerald-50 border border-emerald-200 rounded-lg">
                  <label className="block text-[11px] font-bold text-emerald-800 mb-1">Пополнить баланс (например 100 zł):</label>
                  <div className="flex gap-2">
                    <input 
                      type="number" 
                      placeholder="Сумма zł" 
                      value={paymentAddVal} 
                      onChange={e => setPaymentAddVal(e.target.value)}
                      className="w-full text-xs px-2.5 py-1.5 border border-emerald-300 rounded bg-white"
                    />
                    <button 
                      onClick={handleAddDeposit}
                      className="px-3 py-1.5 bg-emerald-600 text-white text-xs font-bold rounded hover:bg-emerald-700"
                    >
                      Внести
                    </button>
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">Статус проведения занятия:</label>
                  <div className="grid grid-cols-3 gap-2">
                    <button 
                      onClick={() => onUpdateStatus(logKey, student?.id, recurring.rate, 'attended', isPaid ? 'paid' : 'unpaid')}
                      className={`py-1.5 px-2 text-xs font-bold rounded-lg border transition ${currentStatus === 'attended' ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-white border-slate-200 hover:bg-slate-50'}`}
                    >
                      ✅ Был
                    </button>
                    <button 
                      onClick={() => onUpdateStatus(logKey, student?.id, recurring.rate, 'scheduled', isPaid ? 'paid' : 'unpaid')}
                      className={`py-1.5 px-2 text-xs font-bold rounded-lg border transition ${currentStatus === 'scheduled' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white border-slate-200 hover:bg-slate-50'}`}
                    >
                      ⏳ План
                    </button>
                    <button 
                      onClick={() => onUpdateStatus(logKey, student?.id, recurring.rate, 'cancelled', 'unpaid')}
                      className={`py-1.5 px-2 text-xs font-bold rounded-lg border transition ${currentStatus === 'cancelled' ? 'bg-rose-600 text-white border-rose-600' : 'bg-white border-slate-200 hover:bg-slate-50'}`}
                    >
                      ❌ Отмена
                    </button>
                  </div>
                </div>

                <div className="pt-2 border-t border-slate-100 flex justify-between">
                  <button 
                    onClick={() => {
                      if (confirm('Освободить это время от ученика во все недели?')) {
                        onAssign(slot.id, null);
                      }
                    }}
                    className="text-xs text-rose-600 hover:underline"
                  >
                    Освободить слот
                  </button>
                  <button onClick={onClose} className="px-4 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg">
                    Закрыть
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
