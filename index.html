    function getWeekDays(offset = 0) {
      const now = new Date();
      const dayOfWeek = now.getDay();
      const diffToMonday = (dayOfWeek === 0 ? -6 : 1) - dayOfWeek;
      
      const monday = new Date(now);
      monday.setDate(now.getDate() + diffToMonday + (offset * 7));
      monday.setHours(0, 0, 0, 0);

      const days = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        days.push(d);
      }
      return days;
    }

    function formatDateKey(date) {
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    }

    function getCurrentDayIndex() {
      const d = new Date().getDay();
      return d === 0 ? 6 : d - 1;
    }

    function App() {
      const [lang, setLang] = useState(() => localStorage.getItem('tutor_lang') || 'pl');
      const t = I18N[lang] || I18N.pl;

      const toggleLanguage = () => {
        const nextLang = lang === 'pl' ? 'ru' : 'pl';
        setLang(nextLang);
        localStorage.setItem('tutor_lang', nextLang);
      };

      const [view, setView] = useState('calendar');
      const [weekOffset, setWeekOffset] = useState(0);
      const [selectedMobileDay, setSelectedMobileDay] = useState(getCurrentDayIndex());
      const [syncStatus, setSyncStatus] = useState('connecting');

      const weekDays = useMemo(() => getWeekDays(weekOffset), [weekOffset]);

      const [workingSlots, setWorkingSlots] = useState(() => {
        try { return JSON.parse(localStorage.getItem('tutor_vault_slots')) || []; } catch(e) { return []; }
      });
      const [students, setStudents] = useState(() => {
        try { return JSON.parse(localStorage.getItem('tutor_vault_students')) || []; } catch(e) { return []; }
      });
      const [recurringLessons, setRecurringLessons] = useState(() => {
        try { return JSON.parse(localStorage.getItem('tutor_vault_recurring')) || []; } catch(e) { return []; }
      });
      const [lessonLogs, setLessonLogs] = useState(() => {
        try { return JSON.parse(localStorage.getItem('tutor_vault_logs')) || {}; } catch(e) { return {}; }
      });

      const [modalSlot, setModalSlot] = useState(null);

      useEffect(() => {
        const unsubscribe = docRef.onSnapshot((doc) => {
          if (doc.exists) {
            const data = doc.data();
            if (data.workingSlots && data.workingSlots.length > 0) {
              setWorkingSlots(data.workingSlots);
              localStorage.setItem('tutor_vault_slots', JSON.stringify(data.workingSlots));
            }
            if (data.students && data.students.length > 0) {
              setStudents(data.students);
              localStorage.setItem('tutor_vault_students', JSON.stringify(data.students));
            }
            if (data.recurringLessons) {
              setRecurringLessons(data.recurringLessons);
              localStorage.setItem('tutor_vault_recurring', JSON.stringify(data.recurringLessons));
            }
            if (data.lessonLogs) {
              setLessonLogs(data.lessonLogs);
              localStorage.setItem('tutor_vault_logs', JSON.stringify(data.lessonLogs));
            }
            setSyncStatus('cloudOk');
          } else {
            const localSlots = JSON.parse(localStorage.getItem('tutor_vault_slots') || '[]');
            const localStudents = JSON.parse(localStorage.getItem('tutor_vault_students') || '[]');
            const localRec = JSON.parse(localStorage.getItem('tutor_vault_recurring') || '[]');
            const localLogs = JSON.parse(localStorage.getItem('tutor_vault_logs') || '{}');

            if (localSlots.length > 0 || localStudents.length > 0) {
              docRef.set({
                workingSlots: localSlots,
                students: localStudents,
                recurringLessons: localRec,
                lessonLogs: localLogs
              }, { merge: true });
            }
            setSyncStatus('cloudOk');
          }
        }, (error) => {
          console.error("Firebase error:", error);
          setSyncStatus('cloudError');
        });

        return () => unsubscribe();
      }, []);

      const saveToCloud = (updates) => {
        setSyncStatus('cloudSaving');

        if (updates.workingSlots) localStorage.setItem('tutor_vault_slots', JSON.stringify(updates.workingSlots));
        if (updates.students) localStorage.setItem('tutor_vault_students', JSON.stringify(updates.students));
        if (updates.recurringLessons) localStorage.setItem('tutor_vault_recurring', JSON.stringify(updates.recurringLessons));
        if (updates.lessonLogs) localStorage.setItem('tutor_vault_logs', JSON.stringify(updates.lessonLogs));

        docRef.set(updates, { merge: true })
          .then(() => setSyncStatus('cloudOk'))
          .catch((err) => {
            console.error(err);
            setSyncStatus('cloudError');
          });
      };

      const handleAddSlot = (day, startTime, duration) => {
        const newSlot = {
          id: Date.now().toString(),
          day: Number(day),
          startTime,
          duration: Number(duration) || 60
        };
        const updated = [...workingSlots, newSlot].sort((a, b) => a.startTime.localeCompare(b.startTime));
        setWorkingSlots(updated);
        saveToCloud({ workingSlots: updated });
      };

      const handleDeleteSlot = (slotId) => {
        const updatedSlots = workingSlots.filter(s => s.id !== slotId);
        const updatedRec = recurringLessons.filter(r => r.slotId !== slotId);
        setWorkingSlots(updatedSlots);
        setRecurringLessons(updatedRec);
        saveToCloud({ workingSlots: updatedSlots, recurringLessons: updatedRec });
      };

      const handleUpdateStudent = (updatedStudent) => {
        const updatedList = students.map(s => s.id === updatedStudent.id ? updatedStudent : s);
        setStudents(updatedList);
        saveToCloud({ students: updatedList });
      };

      const handleDeleteStudent = (studentId) => {
        if (!confirm(t.deleteStudentConfirm)) return;
        const updatedStudents = students.filter(s => s.id !== studentId);
        const updatedRec = recurringLessons.filter(r => r.studentId !== studentId);
        setStudents(updatedStudents);
        setRecurringLessons(updatedRec);
        saveToCloud({ students: updatedStudents, recurringLessons: updatedRec });
      };

      const handleAddPayment = (studentId, amount) => {
        const val = parseFloat(amount);
        if (isNaN(val) || val <= 0) return;
        const updated = students.map(s => s.id === studentId ? { ...s, balance: s.balance + val } : s);
        setStudents(updated);
        saveToCloud({ students: updated });
      };

      const assignStudentToSlot = (slotId, studentId, customRate) => {
        const filtered = recurringLessons.filter(r => r.slotId !== slotId);
        if (studentId) {
          const student = students.find(s => s.id === studentId);
          filtered.push({
            slotId,
            studentId,
            rate: Number(customRate) || (student ? student.defaultRate : 50)
          });
        }
        setRecurringLessons(filtered);
        saveToCloud({ recurringLessons: filtered });
        setModalSlot(null);
      };

      const updateLessonStatus = (logKey, studentId, rate, newStatus, newPaidStatus) => {
        const currentLog = lessonLogs[logKey] || {};
        const oldPaid = currentLog.paidStatus || 'unpaid';
        
        let balanceDelta = 0;
        if (oldPaid !== 'paid' && newPaidStatus === 'paid') {
          balanceDelta = -rate;
        } else if (oldPaid === 'paid' && newPaidStatus !== 'paid') {
          balanceDelta = rate;
        }

        let updatedStudents = students;
        if (balanceDelta !== 0) {
          updatedStudents = students.map(s => s.id === studentId ? { ...s, balance: s.balance + balanceDelta } : s);
          setStudents(updatedStudents);
        }

        const updatedLogs = {
          ...lessonLogs,
          [logKey]: {
            ...currentLog,
            status: newStatus,
            paidStatus: newPaidStatus
          }
        };
        setLessonLogs(updatedLogs);
        saveToCloud({ students: updatedStudents, lessonLogs: updatedLogs });
      };

      const calculateEndTime = (startTime, duration) => {
        if (!startTime) return '';
        const [h, m] = startTime.split(':').map(Number);
        const totalMinutes = h * 60 + m + Number(duration);
        const endH = Math.floor(totalMinutes / 60) % 24;
        const endM = totalMinutes % 60;
        return `${String(endH).padStart(2, '0')}:${String(endM).padStart(2, '0')}`;
      };

      const exportBackup = () => {
        const data = { workingSlots, students, recurringLessons, lessonLogs };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `tutor_backup_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
      };

      const importBackup = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data.students) setStudents(data.students);
            if (data.workingSlots) setWorkingSlots(data.workingSlots);
            if (data.recurringLessons) setRecurringLessons(data.recurringLessons);
            if (data.lessonLogs) setLessonLogs(data.lessonLogs);
            saveToCloud(data);
            alert('Dane przywrócone! / Данные восстановлены!');
          } catch (err) {
            alert('Błąd pliku! / Ошибка файла!');
          }
        };
        reader.readAsText(file);
      };

      const weekStats = () => {
        let plannedCount = 0;
        let expectedTotal = 0;
        let earnedPaid = 0;
        let pendingToCollect = 0;

        weekDays.forEach((date, dayIdx) => {
          const dateStr = formatDateKey(date);
          const daySlots = workingSlots.filter(s => s.day === dayIdx);
          
          daySlots.forEach(slot => {
            const rel = recurringLessons.find(r => r.slotId === slot.id);
            if (!rel) return;

            const logKey = `${dateStr}_${slot.id}`;
            const log = lessonLogs[logKey];
            const student = students.find(s => s.id === rel.studentId);
            const isExplicitlyPaid = log?.paidStatus === 'paid';

            if (log?.status !== 'cancelled') {
              plannedCount++;
              expectedTotal += rel.rate;

              if (isExplicitlyPaid) {
                earnedPaid += rel.rate;
              } else {
                const bal = student ? Math.max(0, student.balance) : 0;
                if (bal >= rel.rate) {
                  earnedPaid += rel.rate;
                } else if (bal > 0) {
                  earnedPaid += bal;
                  pendingToCollect += (rel.rate - bal);
                } else {
                  pendingToCollect += rel.rate;
                }
              }
            }
          });
        });

        return { plannedCount, expectedTotal, earnedPaid, pendingToCollect };
      };

      const stats = weekStats();
      const todayStr = formatDateKey(new Date());

      const renderDayColumn = (date, dayIdx, isMobile = false) => {
        const dateStr = formatDateKey(date);
        const isToday = dateStr === todayStr;
        const daySlots = workingSlots
          .filter(s => s.day === dayIdx)
          .sort((a, b) => a.startTime.localeCompare(b.startTime));

        return (
          <div 
            key={dateStr} 
            className={`p-3 rounded-2xl border flex flex-col min-h-[340px] transition ${
              isToday ? 'bg-indigo-50/40 border-indigo-300 ring-2 ring-indigo-200/50' : 'bg-slate-100/70 border-slate-200'
            } ${isMobile ? 'w-full shadow-sm' : ''}`}
          >
            <div className="pb-2.5 mb-2.5 border-b border-slate-200 flex justify-between items-center">
              <div>
                <div className={`text-xs font-bold ${isToday ? 'text-indigo-700' : 'text-slate-800'}`}>
                  {t.days[dayIdx]}
                </div>
                <div className="text-[11px] text-slate-500 font-medium">
                  {date.getDate()} {t.months[date.getMonth()]}
                </div>
              </div>
              {isToday && (
                <span className="text-[10px] bg-indigo-600 text-white font-bold px-2 py-0.5 rounded-full">
                  {t.today}
                </span>
              )}
            </div>

            {daySlots.length === 0 ? (
              <div className="flex-1 flex flex-col items-center justify-center text-xs text-slate-400 italic py-8">
                <span>{t.freeDay}</span>
                <span className="text-[10px] text-slate-300 mt-0.5">{t.noWorkingHours}</span>
              </div>
            ) : (
              <div className="space-y-2 flex-1">
                {daySlots.map(slot => {
                  const recurring = recurringLessons.find(r => r.slotId === slot.id);
                  const student = recurring ? students.find(s => s.id === recurring.studentId) : null;
                  const logKey = `${dateStr}_${slot.id}`;
                  const log = lessonLogs[logKey];

                  const isExplicitlyPaid = log?.paidStatus === 'paid';
                  const balance = student ? student.balance : 0;
                  const isFullyCoveredByBalance = balance >= (recurring?.rate || 0);
                  const isPaid = isExplicitlyPaid || (log?.paidStatus === undefined && isFullyCoveredByBalance);
                  
                  const hasPartialPayment = !isPaid && balance > 0 && balance < (recurring?.rate || 0);
                  const dopłataKwota = hasPartialPayment ? (recurring.rate - balance) : recurring?.rate;

                  const status = log?.status || 'scheduled';

                  return (
                    <div key={slot.id} className="bg-white rounded-xl border border-slate-200 p-2.5 shadow-sm">
                      <div className="flex items-center justify-between text-xs font-semibold text-slate-500 mb-1.5">
                        <span>⏰ {slot.startTime} – {calculateEndTime(slot.startTime, slot.duration)}</span>
                        <span className="text-[10px] text-slate-400">{slot.duration} {t.min}</span>
                      </div>

                      {!recurring ? (
                        <button 
                          onClick={() => setModalSlot({ slot, recurring: null, dateStr, dayIdx })}
                          className="w-full py-2 border border-dashed border-slate-300 hover:border-indigo-400 hover:bg-indigo-50/30 rounded-lg text-slate-400 hover:text-indigo-600 text-xs font-semibold transition"
                        >
                          {t.bookStudent}
                        </button>
                      ) : (
                        <div 
                          onClick={() => setModalSlot({ slot, recurring, logKey, student, log, dateStr, dayIdx, dopłataKwota, hasPartialPayment, isPaid })}
                          className={`p-2 rounded-lg cursor-pointer border transition ${
                            status === 'cancelled' 
                              ? 'bg-rose-50 border-rose-200 opacity-60 text-slate-500' 
                              : status === 'attended' 
                              ? 'bg-emerald-50/70 border-emerald-200' 
                              : 'bg-indigo-50/40 border-indigo-100 hover:border-indigo-300'
                          }`}
                        >
                          {/* Полное имя ученика без сжатия */}
                          <div className="font-bold text-xs text-slate-900 leading-snug mb-1">
                            {student?.name || t.studentDeleted}
                          </div>

                          {/* Статус оплаты на отдельной строке */}
                          <div className="mb-1.5">
                            {isPaid ? (
                              <span className="inline-block text-[10px] px-1.5 py-0.5 rounded font-bold bg-emerald-100 text-emerald-800">
                                {t.paid}
                              </span>
                            ) : hasPartialPayment ? (
                              <span className="inline-block text-[10px] px-1.5 py-0.5 rounded font-bold bg-amber-100 text-amber-900 border border-amber-300">
                                {t.surcharge} {dopłataKwota} zł
                              </span>
                            ) : (
                              <span className="inline-block text-[10px] px-1.5 py-0.5 rounded font-bold bg-amber-50 text-amber-800 border border-amber-200">
                                {t.toCollect}: {recurring.rate} zł
                              </span>
                            )}
                          </div>

                          <div className="text-xs text-slate-600 flex justify-between items-center">
                            <span className="font-semibold">{t.cost} {recurring.rate} zł</span>
                            {student?.balance > 0 && (
                              <span className="text-[10px] text-emerald-700 font-bold bg-emerald-50 px-1.5 py-0.5 rounded">
                                {t.prepayment} {student.balance} zł
                              </span>
                            )}
                          </div>

                          <div className="text-[10px] text-slate-500 pt-1 mt-1 border-t border-slate-200/60 flex justify-between items-center">
                            <span>
                              {status === 'scheduled' && t.statusScheduled}
                              {status === 'attended' && t.statusAttended}
                              {status === 'cancelled' && t.statusCancelled}
                            </span>
                          </div>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        );
      };

      return (
        <div className="max-w-7xl mx-auto p-3 sm:p-6 pb-16">
          <header className="flex flex-col md:flex-row md:items-center justify-between gap-3 pb-3 border-b border-slate-200">
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2">
                <h1 className="text-xl font-extrabold text-slate-900 tracking-tight">
                  📅 TutorFlow
                </h1>
                <span className="text-[11px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200 px-2 py-0.5 rounded-full">
                  {t[syncStatus] || syncStatus}
                </span>

                <button 
                  onClick={toggleLanguage}
                  className="ml-1 text-xs font-bold px-2 py-1 bg-white border border-slate-300 hover:border-indigo-400 rounded-lg shadow-sm text-slate-700 transition"
                >
                  {lang === 'pl' ? '🇵🇱 PL' : '🇷🇺 RU'}
                </button>
              </div>

              <div className="flex items-center gap-1">
                <button onClick={exportBackup} className="text-xs font-bold px-2 py-1 bg-white border border-slate-200 rounded-lg text-slate-600 hover:bg-slate-50" title="Kopia zapasowa">
                  {t.backupBtn}
                </button>
                <label className="text-xs font-bold px-2 py-1 bg-white border border-slate-200 rounded-lg text-slate-600 hover:bg-slate-50 cursor-pointer" title="Wczytaj kopię">
                  {t.restoreBtn}
                  <input type="file" accept=".json" onChange={importBackup} className="hidden" />
                </label>
              </div>
            </div>

            <div className="grid grid-cols-3 gap-1.5 sm:flex sm:items-center">
              <button 
                onClick={() => setView('calendar')} 
                className={`py-2 px-3 text-center rounded-xl text-xs font-bold transition ${view === 'calendar' ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white text-slate-700 border border-slate-200 hover:bg-slate-50'}`}
              >
                {t.tabSchedule}
              </button>
              <button 
                onClick={() => setView('slots_setup')} 
                className={`py-2 px-3 text-center rounded-xl text-xs font-bold transition ${view === 'slots_setup' ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white text-slate-700 border border-slate-200 hover:bg-slate-50'}`}
              >
                {t.tabSlots} ({workingSlots.length})
              </button>
              <button 
                onClick={() => setView('students')} 
                className={`py-2 px-3 text-center rounded-xl text-xs font-bold transition ${view === 'students' ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white text-slate-700 border border-slate-200 hover:bg-slate-50'}`}
              >
                {t.tabStudents} ({students.length})
              </button>
            </div>
          </header>

          {/* ВИД 1: КАЛЕНДАРЬ */}
          {view === 'calendar' && (
            <div className="mt-3 sm:mt-5">
              {workingSlots.length === 0 ? (
                <div className="bg-amber-50 border border-amber-200 p-6 rounded-2xl text-center max-w-lg mx-auto my-6">
                  <h3 className="font-bold text-amber-900 text-base mb-1">{t.noSlotsTitle}</h3>
                  <p className="text-xs text-amber-700 mb-4">{t.noSlotsDesc}</p>
                  <button onClick={() => setView('slots_setup')} className="px-4 py-2 bg-indigo-600 text-white font-bold text-xs rounded-xl hover:bg-indigo-700 shadow-sm">
                    {t.setSlotsBtn}
                  </button>
                </div>
              ) : (
                <>
                  <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-3.5 mb-3.5">
                    <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                      <button 
                        onClick={() => setWeekOffset(prev => prev - 1)} 
                        className="w-8 h-8 flex items-center justify-center rounded-xl border border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100 active:scale-95 transition font-bold"
                        title={t.prevWeek}
                      >
                        ‹
                      </button>

                      <div className="text-center">
                        <div className="text-xs sm:text-sm font-extrabold text-slate-800">
                          {weekDays[0].getDate()} {t.months[weekDays[0].getMonth()]} — {weekDays[6].getDate()} {t.months[weekDays[6].getMonth()]} {weekDays[6].getFullYear()} {lang === 'pl' ? 'r.' : 'г.'}
                        </div>
                        {weekOffset !== 0 ? (
                          <button 
                            onClick={() => {
                              setWeekOffset(0);
                              setSelectedMobileDay(getCurrentDayIndex());
                            }}
                            className="text-[10px] text-indigo-600 font-bold hover:underline mt-0.5 block mx-auto"
                          >
                            {t.backToCurrentWeek}
                          </button>
                        ) : (
                          <span className="text-[10px] text-slate-400 font-semibold uppercase tracking-wider block">{t.currentWeek}</span>
                        )}
                      </div>

                      <button 
                        onClick={() => setWeekOffset(prev => prev + 1)} 
                        className="w-8 h-8 flex items-center justify-center rounded-xl border border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100 active:scale-95 transition font-bold"
                        title={t.nextWeek}
                      >
                        ›
                      </button>
                    </div>

                    <div className="grid grid-cols-3 gap-2 pt-3">
                      <div className="bg-indigo-50/70 border border-indigo-100/80 rounded-xl p-2 text-center">
                        <span className="text-[10px] uppercase font-bold text-indigo-600 block">{t.plan}</span>
                        <span className="text-xs sm:text-sm font-black text-indigo-950 mt-0.5 block">{stats.expectedTotal} zł</span>
                      </div>

                      <div className="bg-emerald-50/70 border border-emerald-100/80 rounded-xl p-2 text-center">
                        <span className="text-[10px] uppercase font-bold text-emerald-600 block">{t.paid}</span>
                        <span className="text-xs sm:text-sm font-black text-emerald-800 mt-0.5 block">{stats.earnedPaid} zł</span>
                      </div>

                      <div className="bg-amber-50/70 border border-amber-100/80 rounded-xl p-2 text-center">
                        <span className="text-[10px] uppercase font-bold text-amber-700 block">{t.toCollect}</span>
                        <span className="text-xs sm:text-sm font-black text-amber-900 mt-0.5 block">{stats.pendingToCollect} zł</span>
                      </div>
                    </div>
                  </div>

                  <div className="block lg:hidden mb-4">
                    <div className="flex gap-1.5 overflow-x-auto no-scrollbar pb-1">
                      {weekDays.map((date, idx) => {
                        const dateStr = formatDateKey(date);
                        const isToday = dateStr === todayStr;
                        const isSelected = selectedMobileDay === idx;
                        const slotsCount = workingSlots.filter(s => s.day === idx).length;

                        return (
                          <button
                            key={idx}
                            onClick={() => setSelectedMobileDay(idx)}
                            className={`flex-1 min-w-[48px] py-2 px-1 rounded-xl text-center border flex flex-col items-center transition ${
                              isSelected 
                                ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm' 
                                : isToday 
                                ? 'bg-indigo-50 border-indigo-200 text-indigo-800' 
                                : 'bg-white border-slate-200 text-slate-700'
                            }`}
                          >
                            <span className="text-[10px] uppercase font-bold">
                              {t.shortDays[idx]}
                            </span>
                            <span className="text-sm font-extrabold mt-0.5">
                              {date.getDate()}
                            </span>
                            {slotsCount > 0 && (
                              <span className={`text-[9px] mt-1 px-1 rounded-full font-semibold ${isSelected ? 'bg-indigo-500 text-white' : 'bg-slate-100 text-slate-600'}`}>
                                {slotsCount}
                              </span>
                            )}
                          </button>
                        );
                      })}
                    </div>

                    <div className="mt-3">
                      {renderDayColumn(weekDays[selectedMobileDay], selectedMobileDay, true)}
                    </div>
                  </div>

                  <div className="hidden lg:grid lg:grid-cols-7 gap-3">
                    {weekDays.map((date, dayIdx) => renderDayColumn(date, dayIdx, false))}
                  </div>
                </>
              )}
            </div>
          )}

          {/* ВИД 2: ЧАСЫ */}
          {view === 'slots_setup' && (
            <SlotsManager 
              t={t}
              workingSlots={workingSlots} 
              onAddSlot={handleAddSlot} 
              onDeleteSlot={handleDeleteSlot}
              calculateEndTime={calculateEndTime}
              onGoToCalendar={() => setView('calendar')}
            />
          )}

          {/* ВИД 3: УЧЕНИКИ */}
          {view === 'students' && (
            <StudentsManager 
              t={t}
              students={students} 
              setStudents={(newStudents) => {
                setStudents(newStudents);
                saveToCloud({ students: newStudents });
              }} 
              onUpdateStudent={handleUpdateStudent}
              onAddPayment={handleAddPayment} 
              onDeleteStudent={handleDeleteStudent}
            />
          )}

          {/* МОДАЛЬНОЕ ОКНО */}
          {modalSlot && (
            <LessonModal 
              t={t}
              data={modalSlot} 
              onClose={() => setModalSlot(null)}
              students={students}
              onAssign={assignStudentToSlot}
              onUpdateStatus={updateLessonStatus}
              onAddPayment={handleAddPayment}
              calculateEndTime={calculateEndTime}
              onOpenStudentsTab={() => { setModalSlot(null); setView('students'); }}
            />
          )}
        </div>
      );
    }

    function SlotsManager({ t, workingSlots, onAddSlot, onDeleteSlot, calculateEndTime, onGoToCalendar }) {
      const [day, setDay] = useState(0);
      const [startTime, setStartTime] = useState('14:30');
      const [duration, setDuration] = useState(60);

      const handleFormSubmit = (e) => {
        e.preventDefault();
        if (!startTime) return;
        onAddSlot(day, startTime, duration);
      };

      return (
        <div className="mt-4 grid grid-cols-1 md:grid-cols-3 gap-4">
          <div className="bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-sm h-fit">
            <h3 className="font-bold text-slate-900 text-base mb-1">{t.addSlotsTitle}</h3>
            <p className="text-xs text-slate-500 mb-3">{t.addSlotsDesc}</p>
            
            <form onSubmit={handleFormSubmit} className="space-y-3">
              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">{t.dayOfWeek}</label>
                <select 
                  value={day} 
                  onChange={e => setDay(Number(e.target.value))}
                  className="w-full text-sm px-3 py-2 border border-slate-300 rounded-xl focus:outline-indigo-500 bg-white"
                >
                  {t.days.map((d, idx) => <option key={d} value={idx}>{d}</option>)}
                </select>
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">{t.startTime}</label>
                <input 
                  type="time" 
                  value={startTime} 
                  onChange={e => setStartTime(e.target.value)}
                  className="w-full text-sm px-3 py-2 border border-slate-300 rounded-xl focus:outline-indigo-500 bg-white"
                  required
                />
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">{t.duration}</label>
                <select 
                  value={duration} 
                  onChange={e => setDuration(Number(e.target.value))}
                  className="w-full text-sm px-3 py-2 border border-slate-300 rounded-xl focus:outline-indigo-500 bg-white"
                >
                  <option value={45}>45 {t.min}</option>
                  <option value={60}>60 {t.min}</option>
                  <option value={90}>90 {t.min}</option>
                  <option value={120}>120 {t.min}</option>
                </select>
              </div>

              <button type="submit" className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-bold transition shadow-sm">
                {t.addSlotBtn}
              </button>
            </form>
          </div>

          <div className="md:col-span-2 space-y-3">
            <div className="flex justify-between items-center">
              <h3 className="font-bold text-slate-900 text-base">{t.activeSlotsTitle} ({workingSlots.length})</h3>
              {workingSlots.length > 0 && (
                <button onClick={onGoToCalendar} className="text-xs bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-1.5 rounded-xl font-bold transition">
                  {t.openCalendarBtn}
                </button>
              )}
            </div>

            {workingSlots.length === 0 ? (
              <div className="bg-white p-8 rounded-2xl border border-dashed border-slate-300 text-center text-slate-400 text-xs sm:text-sm">
                {t.emptySlotsList}
              </div>
            ) : (
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                {t.days.map((dName, dIdx) => {
                  const daySlots = workingSlots.filter(s => s.day === dIdx).sort((a,b) => a.startTime.localeCompare(b.startTime));
                  if (daySlots.length === 0) return null;

                  return (
                    <div key={dName} className="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm">
                      <h4 className="font-bold text-xs text-indigo-600 uppercase tracking-wider mb-2">{dName}</h4>
                      <div className="space-y-1.5">
                        {daySlots.map(s => (
                          <div key={s.id} className="flex justify-between items-center text-xs bg-slate-50 p-2 rounded-xl border border-slate-100">
                            <span className="font-semibold text-slate-700">
                              ⏰ {s.startTime} – {calculateEndTime(s.startTime, s.duration)} <span className="text-slate-400 font-normal">({s.duration} {t.min})</span>
                            </span>
                            <button 
                              onClick={() => onDeleteSlot(s.id)}
                              className="text-rose-500 hover:text-rose-700 font-bold px-2 py-1 text-sm"
                              title="Usuń"
                            >
                              ✕
                            </button>
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      );
    }

    function StudentsManager({ t, students, setStudents, onUpdateStudent, onAddPayment, onDeleteStudent }) {
      const [name, setName] = useState('');
      const [rate, setRate] = useState(50);
      const [note, setNote] = useState('');
      const [payInputs, setPayInputs] = useState({});
      const [editingStudent, setEditingStudent] = useState(null);

      const handleAddStudent = (e) => {
        e.preventDefault();
        if (!name.trim()) return;
        setStudents([...students, {
          id: Date.now().toString(),
          name: name.trim(),
          defaultRate: Number(rate) || 50,
          balance: 0,
          note: note.trim()
        }]);
        setName('');
        setNote('');
      };

      const handleSaveEdit = (e) => {
        e.preventDefault();
        if (!editingStudent) return;
        onUpdateStudent(editingStudent);
        setEditingStudent(null);
      };

      const handlePaymentSubmit = (id) => {
        const val = payInputs[id];
        if (val) {
          onAddPayment(id, val);
          setPayInputs({ ...payInputs, [id]: '' });
        }
      };

      return (
        <div className="mt-4 grid grid-cols-1 md:grid-cols-3 gap-4">
          <div className="bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-sm h-fit">
            <h3 className="font-bold text-slate-900 mb-3">{t.newStudentTitle}</h3>
            <form onSubmit={handleAddStudent} className="space-y-3">
              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">{t.studentNameLabel}</label>
                <input 
                  type="text" 
                  value={name} 
                  onChange={e => setName(e.target.value)} 
                  placeholder={t.namePlaceholder}
                  className="w-full text-sm px-3 py-2 border border-slate-300 rounded-xl focus:outline-indigo-500"
                  required
                />
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">{t.rateLabel}</label>
                <input 
                  type="number" 
                  value={rate} 
                  onChange={e => setRate(e.target.value)} 
                  className="w-full text-sm px-3 py-2 border border-slate-300 rounded-xl focus:outline-indigo-500"
                  required
                />
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">{t.noteLabel}</label>
                <input 
                  type="text" 
                  value={note} 
                  onChange={e => setNote(e.target.value)} 
                  placeholder={t.notePlaceholder}
                  className="w-full text-sm px-3 py-2 border border-slate-300 rounded-xl focus:outline-indigo-500"
                />
              </div>
              <button type="submit" className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-bold transition shadow-sm">
                {t.addStudentBtn}
              </button>
            </form>
          </div>

          <div className="md:col-span-2 space-y-3">
            <h3 className="font-bold text-slate-900 mb-2">{t.allStudentsTitle} ({students.length})</h3>
            {students.length === 0 ? (
              <div className="bg-white p-8 rounded-2xl border border-dashed border-slate-300 text-center text-slate-400 text-xs sm:text-sm">
                {t.emptyStudentsList}
              </div>
            ) : (
              students.map(st => (
                <div key={st.id} className="bg-white p-3.5 sm:p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                  <div>
                    <div className="flex items-center gap-2">
                      <h4 className="font-bold text-slate-900">{st.name}</h4>
                      <span className="text-xs bg-indigo-50 text-indigo-700 font-semibold px-2 py-0.5 rounded-lg">
                        {st.defaultRate} {t.ratePerLesson}
                      </span>
                    </div>
                    {st.note && <p className="text-xs text-slate-500 mt-0.5">{st.note}</p>}
                    <div className="mt-1 text-xs">
                      {t.balanceLabel} <span className={`font-bold ${st.balance > 0 ? 'text-emerald-600' : st.balance < 0 ? 'text-rose-600' : 'text-slate-600'}`}>{st.balance} zł</span>
                      {st.balance >= st.defaultRate && (
                        <span className="ml-2 text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-medium">
                          +{Math.floor(st.balance / st.defaultRate)} {t.prepaidLessonsCount}
                        </span>
                      )}
                    </div>
                  </div>

                  <div className="flex items-center gap-2 pt-2 sm:pt-0 border-t sm:border-t-0 border-slate-100">
                    <input 
                      type="number" 
                      placeholder="+ zł" 
                      value={payInputs[st.id] || ''} 
                      onChange={e => setPayInputs({ ...payInputs, [st.id]: e.target.value })}
                      className="w-20 text-sm px-2.5 py-1.5 border border-slate-300 rounded-xl"
                    />
                    <button 
                      onClick={() => handlePaymentSubmit(st.id)}
                      className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-xl transition"
                    >
                      {t.depositBtn}
                    </button>
                    
                    <button 
                      onClick={() => setEditingStudent({ ...st })}
                      className="px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl transition"
                    >
                      ✏️
                    </button>

                    <button 
                      onClick={() => onDeleteStudent(st.id)}
                      className="p-1.5 text-rose-500 hover:text-rose-700 font-bold ml-1 text-sm"
                      title="Usuń"
                    >
                      ✕
                    </button>
                  </div>
                </div>
              ))
            )}
          </div>

          {editingStudent && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-sm w-full p-5 shadow-xl border border-slate-200">
                <div className="flex justify-between items-center pb-3 border-b border-slate-100 mb-3">
                  <h3 className="font-bold text-slate-900 text-base">{t.editStudentTitle}</h3>
                  <button onClick={() => setEditingStudent(null)} className="text-slate-400 hover:text-slate-600 text-lg font-bold">✕</button>
                </div>

                <form onSubmit={handleSaveEdit} className="space-y-3">
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">{t.studentNameLabel}</label>
                    <input 
                      type="text" 
                      value={editingStudent.name} 
                      onChange={e => setEditingStudent({ ...editingStudent, name: e.target.value })}
                      className="w-full text-sm px-3 py-2 border border-slate-300 rounded-xl"
                      required
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">{t.rateLabel}</label>
                    <input 
                      type="number" 
                      value={editingStudent.defaultRate} 
                      onChange={e => setEditingStudent({ ...editingStudent, defaultRate: Number(e.target.value) })}
                      className="w-full text-sm px-3 py-2 border border-slate-300 rounded-xl"
                      required
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">{t.balanceEditLabel}</label>
                    <input 
                      type="number" 
                      value={editingStudent.balance} 
                      onChange={e => setEditingStudent({ ...editingStudent, balance: Number(e.target.value) })}
                      className="w-full text-sm px-3 py-2 border border-slate-300 rounded-xl"
                      required
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">{t.noteLabel}</label>
                    <input 
                      type="text" 
                      value={editingStudent.note || ''} 
                      onChange={e => setEditingStudent({ ...editingStudent, note: e.target.value })}
                      className="w-full text-sm px-3 py-2 border border-slate-300 rounded-xl"
                    />
                  </div>

                  <div className="pt-2 flex gap-2">
                    <button 
                      type="button" 
                      onClick={() => setEditingStudent(null)}
                      className="w-1/2 py-2.5 bg-slate-100 text-slate-700 text-xs font-bold rounded-xl"
                    >
                      {t.cancelBtn}
                    </button>
                    <button 
                      type="submit" 
                      className="w-1/2 py-2.5 bg-indigo-600 text-white text-xs font-bold rounded-xl shadow-sm"
                    >
                      {t.saveBtn}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    function LessonModal({ t, data, onClose, students, onAssign, onUpdateStatus, onAddPayment, calculateEndTime, onOpenStudentsTab }) {
      const { slot, recurring, logKey, student, log, dateStr, dayIdx, dopłataKwota, hasPartialPayment, isPaid } = data;
      const [selectedStudentId, setSelectedStudentId] = useState(recurring?.studentId || '');
      const [customRate, setCustomRate] = useState(recurring?.rate || 50);
      const [paymentAddVal, setPaymentAddVal] = useState('');

      const currentStatus = log?.status || 'scheduled';

      const handleAddDeposit = () => {
        if (!student || !paymentAddVal) return;
        onAddPayment(student.id, paymentAddVal);
        setPaymentAddVal('');
      };

      return (
        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 z-50">
          <div className="bg-white rounded-t-3xl sm:rounded-2xl max-w-md w-full p-5 sm:p-6 shadow-2xl border border-slate-200">
            <div className="flex justify-between items-center pb-3 border-b border-slate-100">
              <div>
                <h3 className="font-bold text-slate-900 text-base">
                  {t.days[dayIdx]}, {slot.startTime} – {calculateEndTime(slot.startTime, slot.duration)}
                </h3>
                <p className="text-xs text-slate-500">{t.lessonDate} {dateStr}</p>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl font-bold p-1">✕</button>
            </div>

            {!recurring ? (
              <div className="mt-4 space-y-4">
                {students.length === 0 ? (
                  <div className="text-center py-4">
                    <p className="text-xs text-slate-500 mb-3">{t.noStudentsYet}</p>
                    <button onClick={onOpenStudentsTab} className="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold">
                      {t.createStudentFirst}
                    </button>
                  </div>
                ) : (
                  <>
                    <p className="text-xs text-slate-600 font-medium">{t.assignStudentDesc}</p>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">{t.tabStudents.replace('👥 ', '')}</label>
                      <select 
                        value={selectedStudentId} 
                        onChange={e => {
                          setSelectedStudentId(e.target.value);
                          const st = students.find(s => s.id === e.target.value);
                          if (st) setCustomRate(st.defaultRate);
                        }}
                        className="w-full text-sm px-3 py-2 border border-slate-300 rounded-xl bg-white"
                      >
                        <option value="">{t.selectStudentPlaceholder}</option>
                        {students.map(s => <option key={s.id} value={s.id}>{s.name} ({s.defaultRate} zł)</option>)}
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">{t.rateLabel}</label>
                      <input 
                        type="number" 
                        value={customRate} 
                        onChange={e => setCustomRate(e.target.value)} 
                        className="w-full text-sm px-3 py-2 border border-slate-300 rounded-xl"
                      />
                    </div>

                    <button 
                      onClick={() => onAssign(slot.id, selectedStudentId, customRate)}
                      disabled={!selectedStudentId}
                      className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 text-white rounded-xl text-sm font-bold transition"
                    >
                      {t.saveWeeklyBtn}
                    </button>
                  </>
                )}
              </div>
            ) : (
              <div className="mt-4 space-y-4">
                <div className="bg-slate-50 p-3.5 rounded-xl border border-slate-200 text-sm space-y-1">
                  <div className="flex justify-between font-bold text-slate-900">
                    <span>{student?.name}</span>
                    <span>{t.cost} {recurring.rate} zł</span>
                  </div>
                  <div className="text-xs flex justify-between text-slate-600 pt-1">
                    <span>{t.balanceLabel}</span>
                    <strong className="text-indigo-600">{student?.balance || 0} zł</strong>
                  </div>

                  {hasPartialPayment && (
                    <div className="text-xs flex justify-between text-amber-800 bg-amber-50 p-2 rounded-lg border border-amber-200 mt-2 font-bold">
                      <span>{t.toPayForThisLesson}</span>
                      <span>{dopłataKwota} zł</span>
                    </div>
                  )}
                </div>

                <div className="p-3 bg-emerald-50 border border-emerald-200 rounded-xl">
                  <label className="block text-[11px] font-bold text-emerald-800 mb-1">{t.studentDepositFormLabel}</label>
                  <div className="flex gap-2">
                    <input 
                      type="number" 
                      placeholder={t.amountPlaceholder} 
                      value={paymentAddVal} 
                      onChange={e => setPaymentAddVal(e.target.value)}
                      className="w-full text-xs px-3 py-2 border border-emerald-300 rounded-lg bg-white"
                    />
                    <button 
                      onClick={handleAddDeposit}
                      className="px-4 py-2 bg-emerald-600 text-white text-xs font-bold rounded-lg hover:bg-emerald-700"
                    >
                      {t.depositBtn}
                    </button>
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1.5">{t.lessonStatusLabel}</label>
                  <div className="grid grid-cols-3 gap-2">
                    <button 
                      onClick={() => onUpdateStatus(logKey, student?.id, recurring.rate, 'attended', isPaid ? 'paid' : 'unpaid')}
                      className={`py-2 px-1 text-xs font-bold rounded-xl border transition ${currentStatus === 'attended' ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-white border-slate-200 hover:bg-slate-50'}`}
                    >
                      {t.btnAttended}
                    </button>
                    <button 
                      onClick={() => onUpdateStatus(logKey, student?.id, recurring.rate, 'scheduled', isPaid ? 'paid' : 'unpaid')}
                      className={`py-2 px-1 text-xs font-bold rounded-xl border transition ${currentStatus === 'scheduled' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white border-slate-200 hover:bg-slate-50'}`}
                    >
                      {t.btnScheduled}
                    </button>
                    <button 
                      onClick={() => onUpdateStatus(logKey, student?.id, recurring.rate, 'cancelled', 'unpaid')}
                      className={`py-2 px-1 text-xs font-bold rounded-xl border transition ${currentStatus === 'cancelled' ? 'bg-rose-600 text-white border-rose-600' : 'bg-white border-slate-200 hover:bg-slate-50'}`}
                    >
                      {t.btnCancelled}
                    </button>
                  </div>
                </div>

                <div className="pt-3 border-t border-slate-100 flex justify-between items-center">
                  <button 
                    onClick={() => {
                      if (confirm(t.freeSlotConfirm)) {
                        onAssign(slot.id, null);
                      }
                    }}
                    className="text-xs text-rose-600 hover:underline"
                  >
                    {t.freeSlotBtn}
                  </button>
                  <button onClick={onClose} className="px-5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl">
                    {t.closeBtn}
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
