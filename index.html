<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TutorFlow — Календарь Репетитора</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const DAYS = ['Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота', 'Воскресенье'];
    const SHORT_DAYS = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];

    function App() {
      const [view, setView] = useState('calendar'); // 'calendar' | 'slots_setup' | 'students'
      const [weekOffset, setWeekOffset] = useState(0);

      // Рабочие слоты: [{ id, day: 0..6, startTime: "14:30", duration: 60 }]
      const [workingSlots, setWorkingSlots] = useState(() => {
        const saved = localStorage.getItem('tutor_custom_slots');
        return saved ? JSON.parse(saved) : [
          { id: '1', day: 0, startTime: '14:30', duration: 60 },
          { id: '2', day: 0, startTime: '16:00', duration: 60 },
          { id: '3', day: 2, startTime: '15:30', duration: 60 }
        ];
      });

      const [students, setStudents] = useState(() => {
        const saved = localStorage.getItem('tutor_students');
        return saved ? JSON.parse(saved) : [
          { id: '1', name: 'Алексей', defaultRate: 50, balance: 50, note: '8 класс, подготовка' },
          { id: '2', name: 'Мария', defaultRate: 60, balance: 0, note: 'Геометрия' }
        ];
      });

      // Повторяющиеся уроки: [{ slotId, studentId, rate }]
      const [recurringLessons, setRecurringLessons] = useState(() => {
        const saved = localStorage.getItem('tutor_recurring_v2');
        return saved ? JSON.parse(saved) : [];
      });

      // Логи занятий по неделям: { "week_slotId": { status: 'attended'|'scheduled'|'cancelled', paidStatus: 'paid'|'unpaid' } }
      const [lessonLogs, setLessonLogs] = useState(() => {
        const saved = localStorage.getItem('tutor_logs_v2');
        return saved ? JSON.parse(saved) : {};
      });

      const [modalSlot, setModalSlot] = useState(null);

      // Сохранение в LocalStorage
      useEffect(() => {
        localStorage.setItem('tutor_custom_slots', JSON.stringify(workingSlots));
      }, [workingSlots]);

      useEffect(() => {
        localStorage.setItem('tutor_students', JSON.stringify(students));
      }, [students]);

      useEffect(() => {
        localStorage.setItem('tutor_recurring_v2', JSON.stringify(recurringLessons));
      }, [recurringLessons]);

      useEffect(() => {
        localStorage.setItem('tutor_logs_v2', JSON.stringify(lessonLogs));
      }, [lessonLogs]);

      // Добавить новый слот с произвольным временем
      const handleAddSlot = (day, startTime, duration) => {
        const newSlot = {
          id: Date.now().toString(),
          day: Number(day),
          startTime,
          duration: Number(duration) || 60
        };
        const updated = [...workingSlots, newSlot].sort((a, b) => a.startTime.localeCompare(b.startTime));
        setWorkingSlots(updated);
      };

      // Удалить слот
      const handleDeleteSlot = (slotId) => {
        setWorkingSlots(workingSlots.filter(s => s.id !== slotId));
        setRecurringLessons(recurringLessons.filter(r => r.slotId !== slotId));
      };

      // Пополнение баланса ученика
      const handleAddPayment = (studentId, amount) => {
        const val = parseFloat(amount);
        if (isNaN(val) || val <= 0) return;
        setStudents(students.map(s => s.id === studentId ? { ...s, balance: s.balance + val } : s));
      };

      // Привязка ученика к слоту
      const assignStudentToSlot = (slotId, studentId, customRate) => {
        const filtered = recurringLessons.filter(r => r.slotId !== slotId);
        if (studentId) {
          const student = students.find(s => s.id === studentId);
          filtered.push({
            slotId,
            studentId,
            rate: Number(customRate) || (student ? student.defaultRate : 50)
          });
        }
        setRecurringLessons(filtered);
        setModalSlot(null);
      };

      // Обновление статуса проведения и оплаты урока
      const updateLessonStatus = (logKey, studentId, rate, newStatus, newPaidStatus) => {
        const currentLog = lessonLogs[logKey] || {};
        const oldPaid = currentLog.paidStatus || 'unpaid';
        
        let balanceDelta = 0;
        if (oldPaid !== 'paid' && newPaidStatus === 'paid') {
          balanceDelta = -rate;
        } else if (oldPaid === 'paid' && newPaidStatus !== 'paid') {
          balanceDelta = rate;
        }

        if (balanceDelta !== 0) {
          setStudents(students.map(s => s.id === studentId ? { ...s, balance: s.balance + balanceDelta } : s));
        }

        setLessonLogs({
          ...lessonLogs,
          [logKey]: {
            ...currentLog,
            status: newStatus,
            paidStatus: newPaidStatus
          }
        });
      };

      // Вычисление времени окончания (например, 14:30 + 60 мин = 15:30)
      const calculateEndTime = (startTime, duration) => {
        const [h, m] = startTime.split(':').map(Number);
        const totalMinutes = h * 60 + m + Number(duration);
        const endH = Math.floor(totalMinutes / 60) % 24;
        const endM = totalMinutes % 60;
        return `${String(endH).padStart(2, '0')}:${String(endM).padStart(2, '0')}`;
      };

      // Статистика за неделю
      const weekStats = () => {
        let plannedCount = 0;
        let earned = 0;
        let unpaidCount = 0;

        recurringLessons.forEach(rel => {
          const slot = workingSlots.find(s => s.id === rel.slotId);
          if (!slot) return;

          const key = `${weekOffset}_${rel.slotId}`;
          const log = lessonLogs[key];
          const student = students.find(s => s.id === rel.studentId);
          const isPaid = log?.paidStatus === 'paid' || (student && student.balance >= rel.rate);

          if (log?.status !== 'cancelled') {
            plannedCount++;
            if (isPaid) earned += rel.rate;
            else unpaidCount++;
          }
        });

        return { plannedCount, earned, unpaidCount };
      };

      const stats = weekStats();

      return (
        <div className="max-w-7xl mx-auto p-4 sm:p-6">
          {/* Хедер */}
          <header className="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-6 border-b border-slate-200">
            <div>
              <h1 className="text-2xl font-bold text-slate-900 tracking-tight flex items-center gap-2">
                📅 TutorFlow <span className="text-xs bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full font-semibold">CRM Репетитора</span>
              </h1>
              <p className="text-sm text-slate-500 mt-0.5">Гибкие часы работы, учет оплат и баланс занятий</p>
            </div>

            <div className="flex flex-wrap items-center gap-2">
              <button 
                onClick={() => setView('calendar')} 
                className={`px-3.5 py-1.5 rounded-lg text-sm font-medium transition ${view === 'calendar' ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white text-slate-700 hover:bg-slate-100 border border-slate-200'}`}
              >
                Расписание
              </button>
              <button 
                onClick={() => setView('slots_setup')} 
                className={`px-3.5 py-1.5 rounded-lg text-sm font-medium transition ${view === 'slots_setup' ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white text-slate-700 hover:bg-slate-100 border border-slate-200'}`}
              >
                ⚙️ Часы работы (Любое время)
              </button>
              <button 
                onClick={() => setView('students')} 
                className={`px-3.5 py-1.5 rounded-lg text-sm font-medium transition ${view === 'students' ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white text-slate-700 hover:bg-slate-100 border border-slate-200'}`}
              >
                👥 Ученики & Баланс
              </button>
            </div>
          </header>

          {/* Вид: Календарь (По дням недели) */}
          {view === 'calendar' && (
            <div className="mt-6">
              {/* Недельная навигация и сводка */}
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6 bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <div className="flex items-center gap-2">
                  <button onClick={() => setWeekOffset(w => w - 1)} className="p-1.5 border border-slate-200 rounded-lg hover:bg-slate-100 font-bold">←</button>
                  <button onClick={() => setWeekOffset(0)} className="px-3 py-1 border border-slate-200 rounded-lg hover:bg-slate-100 text-xs font-medium">Текущая неделя</button>
                  <button onClick={() => setWeekOffset(w => w + 1)} className="p-1.5 border border-slate-200 rounded-lg hover:bg-slate-100 font-bold">→</button>
                  <span className="text-sm font-semibold text-slate-700 ml-2">
                    {weekOffset === 0 ? 'Текущая неделя' : weekOffset > 0 ? `Через +${weekOffset} нед.` : `${weekOffset} нед. назад`}
                  </span>
                </div>

                <div className="flex items-center gap-3 text-xs sm:text-sm">
                  <div className="bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-100">
                    <span className="text-slate-500">Уроков:</span> <strong className="text-slate-800">{stats.plannedCount}</strong>
                  </div>
                  <div className="bg-emerald-50 px-3 py-1.5 rounded-lg border border-emerald-100">
                    <span className="text-emerald-700">Оплачено/в балансе:</span> <strong className="text-emerald-800">{stats.earned} zł</strong>
                  </div>
                  <div className="bg-amber-50 px-3 py-1.5 rounded-lg border border-amber-100">
                    <span className="text-amber-700">Не оплачено:</span> <strong className="text-amber-800">{stats.unpaidCount}</strong>
                  </div>
                </div>
              </div>

              {/* Колонки дней недели */}
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-7 gap-4">
                {DAYS.map((dayName, dayIdx) => {
                  const daySlots = workingSlots
                    .filter(s => s.day === dayIdx)
                    .sort((a, b) => a.startTime.localeCompare(b.startTime));

                  return (
                    <div key={dayName} className="bg-slate-100/70 p-3 rounded-xl border border-slate-200 flex flex-col min-h-[400px]">
                      <div className="font-bold text-sm text-slate-800 pb-2 mb-2 border-b border-slate-200 flex justify-between items-center">
                        <span>{dayName}</span>
                        <span className="text-xs bg-slate-200 text-slate-600 px-1.5 py-0.5 rounded-full">{daySlots.length}</span>
                      </div>

                      {daySlots.length === 0 ? (
                        <div className="flex-1 flex items-center justify-center text-xs text-slate-400 italic">
                          Выходной
                        </div>
                      ) : (
                        <div className="space-y-2.5 flex-1">
                          {daySlots.map(slot => {
                            const recurring = recurringLessons.find(r => r.slotId === slot.id);
                            const student = recurring ? students.find(s => s.id === recurring.studentId) : null;
                            const logKey = `${weekOffset}_${slot.id}`;
                            const log = lessonLogs[logKey];

                            const isAutoPaidByBalance = student && student.balance >= (recurring?.rate || 0);
                            const isPaid = log?.paidStatus === 'paid' || (log?.paidStatus === undefined && isAutoPaidByBalance);
                            const status = log?.status || 'scheduled';

                            return (
                              <div key={slot.id} className="bg-white rounded-lg border border-slate-200 p-2.5 shadow-sm">
                                <div className="flex items-center justify-between text-xs font-semibold text-slate-500 mb-1.5">
                                  <span>⏰ {slot.startTime} – {calculateEndTime(slot.startTime, slot.duration)}</span>
                                  <span className="text-[10px] text-slate-400">{slot.duration} мин</span>
                                </div>

                                {!recurring ? (
                                  <button 
                                    onClick={() => setModalSlot({ slot, recurring: null })}
                                    className="w-full py-2 border border-dashed border-slate-300 hover:border-indigo-400 hover:bg-indigo-50/30 rounded text-slate-400 hover:text-indigo-600 text-xs font-medium transition"
                                  >
                                    + Записать ученика
                                  </button>
                                ) : (
                                  <div 
                                    onClick={() => setModalSlot({ slot, recurring, logKey, student, log })}
                                    className={`p-2 rounded-lg cursor-pointer border transition ${
                                      status === 'cancelled' 
                                        ? 'bg-rose-50/70 border-rose-200 opacity-60 text-slate-500' 
                                        : status === 'attended' 
                                        ? 'bg-emerald-50/60 border-emerald-200' 
                                        : 'bg-indigo-50/40 border-indigo-100 hover:border-indigo-300'
                                    }`}
                                  >
                                    <div className="flex justify-between items-start gap-1">
                                      <span className="font-bold text-xs text-slate-900 truncate">{student?.name}</span>
                                      <span className={`text-[10px] px-1.5 py-0.5 rounded font-bold shrink-0 ${isPaid ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}`}>
                                        {isPaid ? 'Оплачено' : 'Долг'}
                                      </span>
                                    </div>

                                    <div className="text-[11px] text-slate-600 mt-1 flex justify-between items-center">
                                      <span>{recurring.rate} zł</span>
                                      {student?.balance > 0 && (
                                        <span className="text-[10px] text-emerald-700 font-medium">Баланс: +{student.balance} zł</span>
                                      )}
                                    </div>

                                    <div className="text-[10px] text-slate-400 pt-1 mt-1 border-t border-slate-200/60 flex justify-between items-center">
                                      <span>
                                        {status === 'scheduled' && '⏳ Запланирован'}
                                        {status === 'attended' && '✅ Проведен'}
                                        {status === 'cancelled' && '❌ Отменен'}
                                      </span>
                                    </div>
                                  </div>
                                )}
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* Вид: Настройка рабочих слотов (любое произвольное время) */}
          {view === 'slots_setup' && (
            <SlotsManager 
              workingSlots={workingSlots} 
              onAddSlot={handleAddSlot} 
              onDeleteSlot={handleDeleteSlot}
              calculateEndTime={calculateEndTime}
            />
          )}

          {/* Вид: Ученики */}
          {view === 'students' && (
            <StudentsManager 
              students={students} 
              setStudents={setStudents} 
              onAddPayment={handleAddPayment} 
            />
          )}

          {/* Модальное окно занятия */}
          {modalSlot && (
            <LessonModal 
              data={modalSlot} 
              onClose={() => setModalSlot(null)}
              students={students}
              onAssign={assignStudentToSlot}
              onUpdateStatus={updateLessonStatus}
              onAddPayment={handleAddPayment}
              calculateEndTime={calculateEndTime}
            />
          )}
        </div>
      );
    }

    // Менеджер произвольных слотов
    function SlotsManager({ workingSlots, onAddSlot, onDeleteSlot, calculateEndTime }) {
      const [day, setDay] = useState(0);
      const [startTime, setStartTime] = useState('14:30');
      const [duration, setDuration] = useState(60);

      const handleFormSubmit = (e) => {
        e.preventDefault();
        onAddSlot(day, startTime, duration);
      };

      return (
        <div className="mt-6 grid grid-cols-1 md:grid-cols-3 gap-6">
          <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm h-fit">
            <h3 className="font-bold text-slate-900 mb-3">Добавить рабочее время</h3>
            <p className="text-xs text-slate-500 mb-4">Вы можете вводить абсолютно любое время (напр. 14:30, 15:15).</p>
            
            <form onSubmit={handleFormSubmit} className="space-y-3">
              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">День недели</label>
                <select 
                  value={day} 
                  onChange={e => setDay(Number(e.target.value))}
                  className="w-full text-sm px-3 py-2 border border-slate-300 rounded-lg focus:outline-indigo-500"
                >
                  {DAYS.map((d, idx) => <option key={d} value={idx}>{d}</option>)}
                </select>
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">Время начала</label>
                <input 
                  type="time" 
                  value={startTime} 
                  onChange={e => setStartTime(e.target.value)}
                  className="w-full text-sm px-3 py-2 border border-slate-300 rounded-lg focus:outline-indigo-500"
                  required
                />
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">Длительность урока</label>
                <select 
                  value={duration} 
                  onChange={e => setDuration(Number(e.target.value))}
                  className="w-full text-sm px-3 py-2 border border-slate-300 rounded-lg focus:outline-indigo-500"
                >
                  <option value={45}>45 минут</option>
                  <option value={60}>60 минут (1 час)</option>
                  <option value={90}>90 минут (1.5 часа)</option>
                  <option value={120}>120 минут (2 часа)</option>
                </select>
              </div>

              <button type="submit" className="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-semibold transition">
                + Добавить слот
              </button>
            </form>
          </div>

          {/* Список настроенных слотов */}
          <div className="md:col-span-2 space-y-4">
            <h3 className="font-bold text-slate-900">Ваши регулярные часы работы</h3>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
              {DAYS.map((dName, dIdx) => {
                const daySlots = workingSlots.filter(s => s.day === dIdx).sort((a,b) => a.startTime.localeCompare(b.startTime));
                if (daySlots.length === 0) return null;

                return (
                  <div key={dName} className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                    <h4 className="font-bold text-xs text-indigo-600 uppercase tracking-wider mb-2">{dName}</h4>
                    <div className="space-y-1.5">
                      {daySlots.map(s => (
                        <div key={s.id} className="flex justify-between items-center text-xs bg-slate-50 p-2 rounded border border-slate-100">
                          <span className="font-medium text-slate-700">
                            {s.startTime} – {calculateEndTime(s.startTime, s.duration)} ({s.duration} мин)
                          </span>
                          <button 
                            onClick={() => onDeleteSlot(s.id)}
                            className="text-rose-500 hover:text-rose-700 font-bold px-1.5"
                            title="Удалить слот"
                          >
                            ✕
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // Менеджер учеников
    function StudentsManager({ students, setStudents, onAddPayment }) {
      const [name, setName] = useState('');
      const [rate, setRate] = useState(50);
      const [note, setNote] = useState('');
      const [payInputs, setPayInputs] = useState({});

      const handleAddStudent = (e) => {
        e.preventDefault();
        if (!name.trim()) return;
        setStudents([...students, {
          id: Date.now().toString(),
          name: name.trim(),
          defaultRate: Number(rate) || 50,
          balance: 0,
          note: note.trim()
        }]);
        setName('');
        setNote('');
      };

      const handlePaymentSubmit = (id) => {
        const val = payInputs[id];
        if (val) {
          onAddPayment(id, val);
          setPayInputs({ ...payInputs, [id]: '' });
        }
      };

      return (
        <div className="mt-6 grid grid-cols-1 md:grid-cols-3 gap-6">
          <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm h-fit">
            <h3 className="font-bold text-slate-900 mb-4">Добавить ученика</h3>
            <form onSubmit={handleAddStudent} className="space-y-3">
              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">Имя ученика</label>
                <input 
                  type="text" 
                  value={name} 
                  onChange={e => setName(e.target.value)} 
                  placeholder="Имя Фамилия"
                  className="w-full text-sm px-3 py-2 border border-slate-300 rounded-lg focus:outline-indigo-500"
                  required
                />
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">Стандартная ставка (zł / урок)</label>
                <input 
                  type="number" 
                  value={rate} 
                  onChange={e => setRate(e.target.value)} 
                  className="w-full text-sm px-3 py-2 border border-slate-300 rounded-lg focus:outline-indigo-500"
                  required
                />
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">Заметка / Класс</label>
                <input 
                  type="text" 
                  value={note} 
                  onChange={e => setNote(e.target.value)} 
                  placeholder="напр. 8 класс / подготовка"
                  className="w-full text-sm px-3 py-2 border border-slate-300 rounded-lg focus:outline-indigo-500"
                />
              </div>
              <button type="submit" className="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-semibold transition">
                + Сохранить ученика
              </button>
            </form>
          </div>

          <div className="md:col-span-2 space-y-3">
            <h3 className="font-bold text-slate-900 mb-2">Список учеников и лицевой счет ({students.length})</h3>
            {students.map(st => (
              <div key={st.id} className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div>
                  <div className="flex items-center gap-2">
                    <h4 className="font-bold text-slate-900">{st.name}</h4>
                    <span className="text-xs text-slate-500">({st.defaultRate} zł/урок)</span>
                  </div>
                  {st.note && <p className="text-xs text-slate-500 mt-0.5">{st.note}</p>}
                  <div className="mt-2 text-xs">
                    Баланс / Предоплата: <span className={`font-bold ${st.balance > 0 ? 'text-emerald-600 font-semibold' : st.balance < 0 ? 'text-rose-600' : 'text-slate-600'}`}>{st.balance} zł</span>
                    {st.balance >= st.defaultRate && (
                      <span className="ml-2 text-[11px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-medium">
                        Оплачено на {Math.floor(st.balance / st.defaultRate)} урок(а) вперед
                      </span>
                    )}
                  </div>
                </div>

                <div className="flex items-center gap-2">
                  <input 
                    type="number" 
                    placeholder="+ Внести zł" 
                    value={payInputs[st.id] || ''} 
                    onChange={e => setPayInputs({ ...payInputs, [st.id]: e.target.value })}
                    className="w-28 text-sm px-2.5 py-1.5 border border-slate-300 rounded-lg"
                  />
                  <button 
                    onClick={() => handlePaymentSubmit(st.id)}
                    className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-lg transition"
                  >
                    Пополнить
                  </button>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // Модальное окно занятия
    function LessonModal({ data, onClose, students, onAssign, onUpdateStatus, onAddPayment, calculateEndTime }) {
      const { slot, recurring, logKey, student, log } = data;
      const [selectedStudentId, setSelectedStudentId] = useState(recurring?.studentId || '');
      const [customRate, setCustomRate] = useState(recurring?.rate || 50);
      const [paymentAddVal, setPaymentAddVal] = useState('');

      const isPaid = log?.paidStatus === 'paid' || (student && student.balance >= (recurring?.rate || 0));
      const currentStatus = log?.status || 'scheduled';

      const handleAddDeposit = () => {
        if (!student || !paymentAddVal) return;
        onAddPayment(student.id, paymentAddVal);
        setPaymentAddVal('');
      };

      return (
        <div className="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
          <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-200">
            <div className="flex justify-between items-center pb-3 border-b border-slate-100">
              <h3 className="font-bold text-slate-900 text-base">
                {DAYS[slot.day]}, {slot.startTime} – {calculateEndTime(slot.startTime, slot.duration)}
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-lg">✕</button>
            </div>

            {!recurring ? (
              <div className="mt-4 space-y-4">
                <p className="text-xs text-slate-600">Закрепить регулярного ученика за этим слотом:</p>
                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">Выберите ученика</label>
                  <select 
                    value={selectedStudentId} 
                    onChange={e => {
                      setSelectedStudentId(e.target.value);
                      const st = students.find(s => s.id === e.target.value);
                      if (st) setCustomRate(st.defaultRate);
                    }}
                    className="w-full text-sm px-3 py-2 border border-slate-300 rounded-lg"
                  >
                    <option value="">-- Выбрать --</option>
                    {students.map(s => <option key={s.id} value={s.id}>{s.name} ({s.defaultRate} zł)</option>)}
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">Стоимость занятия (zł)</label>
                  <input 
                    type="number" 
                    value={customRate} 
                    onChange={e => setCustomRate(e.target.value)} 
                    className="w-full text-sm px-3 py-2 border border-slate-300 rounded-lg"
                  />
                </div>

                <button 
                  onClick={() => onAssign(slot.id, selectedStudentId, customRate)}
                  disabled={!selectedStudentId}
                  className="w-full py-2 bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 text-white rounded-lg text-sm font-semibold transition"
                >
                  Закрепить еженедельно
                </button>
              </div>
            ) : (
              <div className="mt-4 space-y-4">
                <div className="bg-slate-50 p-3 rounded-lg border border-slate-200 text-sm">
                  <div className="flex justify-between font-bold text-slate-900">
                    <span>{student?.name}</span>
                    <span>{recurring.rate} zł</span>
                  </div>
                  <div className="text-xs text-slate-500 mt-1">
                    Баланс предоплаты: <strong className="text-indigo-600">{student?.balance || 0} zł</strong>
                  </div>
                </div>

                {/* Внесение предоплаты */}
                <div className="p-3 bg-emerald-50 border border-emerald-200 rounded-lg">
                  <label className="block text-[11px] font-bold text-emerald-800 mb-1">Внести оплату (например 100 zł за 2 урока):</label>
                  <div className="flex gap-2">
                    <input 
                      type="number" 
                      placeholder="Сумма zł" 
                      value={paymentAddVal} 
                      onChange={e => setPaymentAddVal(e.target.value)}
                      className="w-full text-xs px-2.5 py-1.5 border border-emerald-300 rounded bg-white"
                    />
                    <button 
                      onClick={handleAddDeposit}
                      className="px-3 py-1.5 bg-emerald-600 text-white text-xs font-bold rounded hover:bg-emerald-700"
                    >
                      Внести
                    </button>
                  </div>
                </div>

                {/* Статус */}
                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">Статус урока:</label>
                  <div className="grid grid-cols-3 gap-2">
                    <button 
                      onClick={() => onUpdateStatus(logKey, student.id, recurring.rate, 'attended', isPaid ? 'paid' : 'unpaid')}
                      className={`py-1.5 px-2 text-xs font-bold rounded-lg border transition ${currentStatus === 'attended' ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-white border-slate-200 hover:bg-slate-50'}`}
                    >
                      ✅ Был
                    </button>
                    <button 
                      onClick={() => onUpdateStatus(logKey, student.id, recurring.rate, 'scheduled', isPaid ? 'paid' : 'unpaid')}
                      className={`py-1.5 px-2 text-xs font-bold rounded-lg border transition ${currentStatus === 'scheduled' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white border-slate-200 hover:bg-slate-50'}`}
                    >
                      ⏳ Запланирован
                    </button>
                    <button 
                      onClick={() => onUpdateStatus(logKey, student.id, recurring.rate, 'cancelled', 'unpaid')}
                      className={`py-1.5 px-2 text-xs font-bold rounded-lg border transition ${currentStatus === 'cancelled' ? 'bg-rose-600 text-white border-rose-600' : 'bg-white border-slate-200 hover:bg-slate-50'}`}
                    >
                      ❌ Отменен
                    </button>
                  </div>
                </div>

                <div className="pt-2 border-t border-slate-100 flex justify-between">
                  <button 
                    onClick={() => {
                      if (confirm('Освободить этот слот во все недели?')) {
                        onAssign(slot.id, null);
                      }
                    }}
                    className="text-xs text-rose-600 hover:underline"
                  >
                    Освободить слот
                  </button>
                  <button onClick={onClose} className="px-4 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg">
                    Готово
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
